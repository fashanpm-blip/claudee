<!doctype html>
<html lang="en" class="anim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>Orbit — Secure system</title>
<style>
  /* No real "Orbit Sans" / "Orbit Display" font files exist anywhere in this
     project, so both names resolve straight to their specified fallbacks. */
  :root{
    --ink:#ffffff;
    --surface:#161616;
    --orb-reveal: cubic-bezier(.16,1,.3,1);
    --orb-soft: cubic-bezier(.25,.8,.28,1);
  }

  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--surface);
  }

  body{
    font-family:"Orbit Sans", Arial, Helvetica, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  *{box-sizing:border-box;}

  .viewport{
    position:fixed;
    inset:0;
    background:var(--surface);
  }

  .stage{
    position:absolute;
    inset:0;
    contain:strict;
    isolation:isolate;
  }

  /* ---------- brand mark ---------- */
  .brand-mark{
    position:absolute;
    top:2.141745dvh;
    left:3.854167vw;
    width:clamp(34px, min(3.4375vw, 5.2dvh), 66px);
    height:auto;
    z-index:4;
  }
  .brand-mark line{
    stroke:#fff;
    stroke-width:5px;
    stroke-linecap:square;
  }

  /* ---------- primary nav ---------- */
  .primary-nav{
    position:absolute;
    inset:0;
    pointer-events:none;
    list-style:none;
    margin:0;
    padding:0;
    z-index:4;
  }
  .primary-nav li{
    position:absolute;
    top:3.426791dvh;
    font-size:clamp(13px, min(1.302083vw, 2.05dvh), 25px);
    transform-origin:left top;
    white-space:nowrap;
  }
  .primary-nav a{
    pointer-events:auto;
    color:#fff;
    text-decoration:none;
  }

  /* ---------- secure system pill ---------- */
  .pill{
    position:absolute;
    top:2.336449dvh;
    right:7.5vw;
    height:clamp(34px, 4.439252dvh, 57px);
    display:flex;
    align-items:center;
    padding:0 1.4em;
    background:#fff;
    color:#161616;
    border-radius:999px;
    letter-spacing:0.026923em;
    font-size:clamp(11px, min(1.09375vw, 1.7dvh), 20px);
    z-index:4;
  }

  /* ---------- wordmark ---------- */
  .orbit-word{
    position:absolute;
    top:11.565421dvh;
    left:4.348958vw;
    margin:0;
    font-family:"Orbit Display", "Times New Roman", Times, serif;
    font-size:min(27.8125vw, 55dvh);
    letter-spacing:0.033708em;
    line-height:1;
    z-index:1;
  }
  .orbit-word__mask{
    display:inline-block;
    overflow:hidden;
    padding-bottom:30%;
    margin-bottom:-30%;
    vertical-align:top;
  }
  .orbit-word__inner{
    display:block;
  }
  .orbit-word__white{
    color:#fff;
  }
  .orbit-word__o{
    display:inline-block;
    transform:scaleX(1.0866);
    margin-right:0.042135em;
  }
  .orbit-word__pink{
    background:linear-gradient(180deg, #ffc5dc 0%, #fd86db 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------- flower stack ---------- */
  .flower{
    position:absolute;
    top:14.749065dvh;
    left:49.121328vw;
    height:106.109034dvh;
    transform:translateX(-50%);
    pointer-events:none;
    z-index:2;
  }
  .flower__sizer{
    display:block;
    height:100%;
    width:auto;
    visibility:hidden;
  }
  .flower__layer{
    position:absolute;
    inset:0;
  }
  .flower__layer img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .flower__layer--top{
    mask-image:linear-gradient(#0000, #0000);
    -webkit-mask-image:linear-gradient(#0000, #0000);
    mask-size:100% 100%;
    -webkit-mask-size:100% 100%;
    mask-repeat:no-repeat;
    -webkit-mask-repeat:no-repeat;
  }

  /* ---------- corner copy ---------- */
  .corner-copy{
    position:absolute;
    bottom:4.361371dvh;
    color:#f7f7f7;
    font-size:clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
    line-height:1.35;
    z-index:3;
  }
  .corner-copy--left{
    left:3.177083vw;
    transform:scaleX(1.073);
    transform-origin:left bottom;
  }
  .corner-copy--right{
    left:78.28125vw;
    transform:scaleX(1.058);
    transform-origin:left bottom;
  }
  .support-copy__inner{
    display:block;
  }

  /* ---------- mobile chrome (hidden on desktop) ---------- */
  .burger,
  .scrim,
  .sheet{
    display:none;
  }

  /* ================= entrance animation ================= */
  html.anim .brand-mark{ animation:orb-quiet 620ms var(--orb-soft) both; animation-delay:100ms; }
  html.anim .primary-nav li:nth-child(1){ animation:orb-dim 550ms var(--orb-soft) both; animation-delay:180ms; }
  html.anim .primary-nav li:nth-child(2){ animation:orb-dim 550ms var(--orb-soft) both; animation-delay:225ms; }
  html.anim .primary-nav li:nth-child(3){ animation:orb-dim 550ms var(--orb-soft) both; animation-delay:270ms; }
  html.anim .primary-nav li:nth-child(4){ animation:orb-dim 550ms var(--orb-soft) both; animation-delay:315ms; }
  html.anim .pill{ animation:orb-quiet 620ms var(--orb-soft) both; animation-delay:340ms; }
  html.anim .orbit-word__inner{ animation:orb-word 1150ms var(--orb-reveal) both; animation-delay:300ms; }
  html.anim .flower{ animation:orb-subject 1150ms var(--orb-reveal) both; animation-delay:660ms; }
  html.anim .corner-copy--left .support-copy__inner,
  html.anim .corner-copy--right .support-copy__inner{ animation:orb-corner 720ms var(--orb-soft) both; animation-delay:980ms; }

  @keyframes orb-word{
    from{ transform:translateY(118%); }
    to{ transform:translateY(0); }
  }
  @keyframes orb-subject{
    from{ opacity:0; transform:translateX(-50%) translateY(3.4dvh); }
    to{ opacity:1; transform:translateX(-50%) translateY(0); }
  }
  @keyframes orb-corner{
    from{ opacity:0; transform:translateY(0.8dvh); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes orb-quiet{
    from{ opacity:0; transform:translateY(0.6dvh); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes orb-dim{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    html.anim .brand-mark,
    html.anim .primary-nav li,
    html.anim .pill,
    html.anim .orbit-word__inner,
    html.anim .flower,
    html.anim .support-copy__inner{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    html.anim .flower{ transform:translateX(-50%) !important; }
    html.anim .stage{ animation:orb-dim 280ms ease both; }
  }

  /* ================= responsive ================= */
  @media (max-width:1200px), (orientation:portrait){
    .orbit-word{
      left:0;
      width:100%;
      text-align:center;
    }
  }

  @media (max-width:900px), (max-aspect-ratio:4/5){
    .primary-nav, .pill{ display:none; }

    .burger{
      display:flex;
      position:absolute;
      top:2.141745dvh;
      right:5vw;
      z-index:12;
      width:clamp(40px, 10vw, 52px);
      height:clamp(40px, 10vw, 52px);
      border-radius:999px;
      background:#fff;
      border:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:5px;
      cursor:pointer;
    }
    .burger span{
      display:block;
      width:44%;
      height:2px;
      background:#161616;
    }
    html.anim .burger{ animation:orb-quiet 500ms var(--orb-soft) both; animation-delay:100ms; }

    .scrim{
      position:fixed;
      inset:0;
      z-index:9;
      background:rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transition:opacity 260ms var(--orb-soft);
    }
    .scrim.is-open{
      opacity:1;
      pointer-events:auto;
    }

    .sheet{
      display:block;
      position:fixed;
      top:0;
      right:0;
      bottom:0;
      z-index:10;
      width:min(78vw, 340px);
      background:rgba(22,22,22,.92);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      transform:translateX(100%);
      transition:transform 320ms var(--orb-reveal);
      padding:18vh 8vw;
    }
    .sheet.is-open{ transform:translateX(0); }
    .sheet ul{ list-style:none; margin:0; padding:0; }
    .sheet li{ margin:0 0 4vh; }
    .sheet a{
      color:#fff;
      text-decoration:none;
      font-size:clamp(20px, 6vw, 30px);
    }
  }

  @media (max-aspect-ratio:4/5){
    .flower{
      height:min(55dvh, 110vw);
      top:16dvh;
    }
    .orbit-word{
      font-size:min(27.5vw, 18dvh);
    }
    .corner-copy{
      max-width:42vw;
      white-space:normal;
    }
    .corner-copy--right{ left:auto; right:3.177083vw; }
  }
</style>
</head>
<body>
<main class="viewport">
  <section class="stage" id="stage">

    <svg class="brand-mark" viewBox="0 0 66 62" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="33" y1="1" x2="33" y2="61"/>
      <line x1="3" y1="31" x2="63" y2="31"/>
      <line x1="11.8" y1="9.8" x2="54.2" y2="52.2"/>
      <line x1="54.2" y1="9.8" x2="11.8" y2="52.2"/>
    </svg>

    <nav class="primary-nav" aria-label="Primary">
      <ul style="list-style:none;margin:0;padding:0;">
        <li style="left:10.104167vw; transform:scaleX(1.165);"><a href="#home">Home</a></li>
        <li style="left:17.526042vw; transform:scaleX(1.052);"><a href="#resources">Resources</a></li>
        <li style="left:27.578125vw; transform:scaleX(1.126);"><a href="#benefits">Benefits</a></li>
        <li style="left:36.171875vw; transform:scaleX(1.168);"><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <div class="pill">Secure system</div>

    <h1 class="orbit-word" id="orbit-title" aria-label="Orbit">
      <span class="orbit-word__mask">
        <span class="orbit-word__inner">
          <span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span
          ><span class="orbit-word__pink">BIT</span>
        </span>
      </span>
    </h1>

    <div class="flower">
      <img class="flower__sizer" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="" aria-hidden="true">
      <div class="flower__layer flower__layer--bg">
        <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="Pixel-art pink and violet lily">
      </div>
      <div class="flower__layer flower__layer--top" aria-hidden="true">
        <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85" alt="">
      </div>
    </div>

    <div class="corner-copy corner-copy--left">
      <span class="support-copy__inner">Every workflow,<br>intelligently connected.</span>
    </div>
    <div class="corner-copy corner-copy--right">
      <span class="support-copy__inner">Less manual work.<br>More meaningful output.</span>
    </div>

    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-sheet">
      <span></span><span></span><span></span>
    </button>
    <div class="scrim" id="scrim"></div>
    <nav class="sheet" id="mobile-sheet" aria-hidden="true" inert>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#resources">Resources</a></li>
        <li><a href="#benefits">Benefits</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

  </section>
</main>

<script>
(function(){
  "use strict";

  /* ---------- entrance: drop .anim once the last keyframe finishes ---------- */
  var root = document.documentElement;
  var doneCalled = false;
  function endAnim(){
    if(doneCalled) return;
    doneCalled = true;
    root.classList.remove('anim');
  }
  root.addEventListener('animationend', function(e){
    if(e.target.classList.contains('support-copy__inner') || e.target === document.getElementById('stage')){
      endAnim();
    }
  });
  setTimeout(endAnim, 6000);

  /* ---------- mobile sheet ---------- */
  var burger = document.getElementById('burger');
  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('mobile-sheet');
  var focusables = [];
  var isOpen = false;

  function openSheet(){
    isOpen = true;
    sheet.removeAttribute('inert');
    sheet.setAttribute('aria-hidden', 'false');
    sheet.classList.add('is-open');
    scrim.classList.add('is-open');
    burger.setAttribute('aria-expanded', 'true');
    focusables = Array.prototype.slice.call(sheet.querySelectorAll('a, button'));
    if(focusables.length) focusables[0].focus();
  }
  function closeSheet(){
    isOpen = false;
    sheet.classList.remove('is-open');
    scrim.classList.remove('is-open');
    sheet.setAttribute('aria-hidden', 'true');
    sheet.setAttribute('inert', '');
    burger.setAttribute('aria-expanded', 'false');
    burger.focus();
  }
  burger.addEventListener('click', function(){
    isOpen ? closeSheet() : openSheet();
  });
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if(!isOpen) return;
    if(e.key === 'Escape'){
      closeSheet();
      return;
    }
    if(e.key === 'Tab' && focusables.length){
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if(e.shiftKey && document.activeElement === first){
        e.preventDefault();
        last.focus();
      } else if(!e.shiftKey && document.activeElement === last){
        e.preventDefault();
        first.focus();
      }
    }
  });

  /* ---------- morph-reveal trail ---------- */
  var TRAIL_MAX_POINTS = 60;
  var TRAIL_HEAD_R = 140;
  var TRAIL_NOISE_AMP = 44;
  var TRAIL_BLOB_PTS = 24;
  var TRAIL_FADE_SPEED = 0.92;
  var TRAIL_SAMPLE_DIST = 8;

  var stage = document.getElementById('stage');
  var flowerEl = document.querySelector('.flower');
  var bgLayer = document.querySelector('.flower__layer--bg');
  var topLayer = document.querySelector('.flower__layer--top');

  var frontCanvas = document.createElement('canvas');
  var topCanvas = document.createElement('canvas');
  frontCanvas.style.display = 'none';
  topCanvas.style.display = 'none';
  document.body.appendChild(frontCanvas);
  document.body.appendChild(topCanvas);
  var fctx = frontCanvas.getContext('2d');
  var tctx = topCanvas.getContext('2d');

  var points = [];
  var headRadius = 0;
  var hovering = false;
  var hasLast = false;
  var lastX = 0, lastY = 0;
  var mouseX = 0, mouseY = 0;
  var time = 0;
  var rafId = null;

  function resizeCanvases(){
    var rect = flowerEl.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    frontCanvas.width = w;
    frontCanvas.height = h;
    topCanvas.width = w;
    topCanvas.height = h;
  }
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);

  function toLocal(clientX, clientY){
    var rect = flowerEl.getBoundingClientRect();
    var scaleX = frontCanvas.width / rect.width;
    var scaleY = frontCanvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function drawMorphBlob(ctx, cx, cy, r, t, seed){
    if(r < 2) return;
    var pts = [];
    for(var i = 0; i < TRAIL_BLOB_PTS; i++){
      var angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
      var n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
      var n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
      var n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
      var noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
      var rad = r + noise;
      pts.push({ x: cx + Math.cos(angle) * rad, y: cy + Math.sin(angle) * rad });
    }
    ctx.beginPath();
    var start = { x: (pts[0].x + pts[pts.length - 1].x) / 2, y: (pts[0].y + pts[pts.length - 1].y) / 2 };
    ctx.moveTo(start.x, start.y);
    for(var j = 0; j < pts.length; j++){
      var cur = pts[j];
      var next = pts[(j + 1) % pts.length];
      var mid = { x: (cur.x + next.x) / 2, y: (cur.y + next.y) / 2 };
      ctx.quadraticCurveTo(cur.x, cur.y, mid.x, mid.y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function resetLayersToIdle(){
    bgLayer.style.maskImage = '';
    bgLayer.style.webkitMaskImage = '';
    topLayer.style.maskImage = 'linear-gradient(#0000, #0000)';
    topLayer.style.webkitMaskImage = 'linear-gradient(#0000, #0000)';
  }

  function frame(){
    time += 0.016;
    var targetR = hovering ? TRAIL_HEAD_R : 0;
    headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);

    if(hovering && headRadius > 5){
      if(!hasLast || Math.hypot(mouseX - lastX, mouseY - lastY) > TRAIL_SAMPLE_DIST){
        points.push({ x: mouseX, y: mouseY, r: headRadius, alpha: 1, seed: Math.random() * 100 });
        if(points.length > TRAIL_MAX_POINTS) points.shift();
        lastX = mouseX; lastY = mouseY; hasLast = true;
      }
    }

    for(var i = points.length - 1; i >= 0; i--){
      var p = points[i];
      p.alpha *= TRAIL_FADE_SPEED;
      p.r *= 0.995;
      if(p.alpha < 0.01) points.splice(i, 1);
    }

    var w = frontCanvas.width, h = frontCanvas.height;

    fctx.globalCompositeOperation = 'source-over';
    fctx.clearRect(0, 0, w, h);
    fctx.fillStyle = '#fff';
    fctx.fillRect(0, 0, w, h);
    fctx.globalCompositeOperation = 'destination-out';
    for(var a = 0; a < points.length; a++){
      var pa = points[a];
      fctx.globalAlpha = pa.alpha;
      fctx.fillStyle = '#fff';
      drawMorphBlob(fctx, pa.x, pa.y, pa.r, time, pa.seed);
    }
    if(hovering && headRadius > 2){
      fctx.globalAlpha = 1;
      fctx.fillStyle = '#fff';
      drawMorphBlob(fctx, mouseX, mouseY, headRadius, time, 0.0001);
    }
    fctx.globalAlpha = 1;

    tctx.clearRect(0, 0, w, h);
    tctx.globalCompositeOperation = 'source-over';
    for(var b = 0; b < points.length; b++){
      var pb = points[b];
      tctx.globalAlpha = pb.alpha;
      tctx.fillStyle = '#fff';
      drawMorphBlob(tctx, pb.x, pb.y, pb.r, time, pb.seed);
    }
    if(hovering && headRadius > 2){
      tctx.globalAlpha = 1;
      tctx.fillStyle = '#fff';
      drawMorphBlob(tctx, mouseX, mouseY, headRadius, time, 0.0001);
    }
    tctx.globalAlpha = 1;

    var frontURL = frontCanvas.toDataURL();
    var topURL = topCanvas.toDataURL();
    bgLayer.style.maskImage = 'url(' + frontURL + ')';
    bgLayer.style.webkitMaskImage = 'url(' + frontURL + ')';
    bgLayer.style.maskSize = '100% 100%';
    bgLayer.style.webkitMaskSize = '100% 100%';
    bgLayer.style.maskRepeat = 'no-repeat';
    bgLayer.style.webkitMaskRepeat = 'no-repeat';

    topLayer.style.maskImage = 'url(' + topURL + ')';
    topLayer.style.webkitMaskImage = 'url(' + topURL + ')';
    topLayer.style.maskSize = '100% 100%';
    topLayer.style.webkitMaskSize = '100% 100%';
    topLayer.style.maskRepeat = 'no-repeat';
    topLayer.style.webkitMaskRepeat = 'no-repeat';

    var active = hovering || headRadius > 0.5 || points.length > 0;
    if(active){
      rafId = requestAnimationFrame(frame);
    } else {
      rafId = null;
      resetLayersToIdle();
    }
  }

  function ensureLoop(){
    if(rafId === null) rafId = requestAnimationFrame(frame);
  }

  stage.addEventListener('mousemove', function(e){
    var local = toLocal(e.clientX, e.clientY);
    mouseX = local.x;
    mouseY = local.y;
    hovering = true;
    ensureLoop();
  });
  stage.addEventListener('mouseenter', function(){
    hovering = true;
    ensureLoop();
  });
  stage.addEventListener('mouseleave', function(){
    hovering = false;
    hasLast = false;
    ensureLoop();
  });
})();
</script>
</body>
</html>
