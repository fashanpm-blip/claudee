<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LevelUp English</title>
<meta name="description" content="Курс английского как учебник: 30 тематических разделов A1–B1 со словами, текстами, грамматикой и письмом, все 13 времён, карточки слов и награды.">
<meta name="theme-color" content="#f5f3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Caveat:wght@700&display=swap">
<style>
/* Calm dark workspace, one violet accent for actions, gold only for rewards (XP, stars). */
/* Bright by default: airy lavender canvas, white cards, a violet→blue accent and one colour per level. */
:root {
  --bg: #f5f3ff; --card: #ffffff; --card-2: #faf9ff; --soft: #eeebfb; --line: rgba(60, 40, 140, .10); --line-2: rgba(60, 40, 140, .18);
  --fg: #1c1640; --muted: #575380; --dim: #67638c;
  --accent: #6d4aff; --accent-2: #2563eb; --on-accent: #ffffff; --accent-soft: rgba(109, 74, 255, .10); --accent-ink: #5532e8;
  --btn-a: #6d4aff; --btn-b: #2563eb;
  --ok: #047857; --ok-soft: rgba(4, 120, 87, .10); --bad: #be123c; --bad-soft: rgba(190, 18, 60, .08); --gold: #92400e; --on-bad: #ffffff;
  --l1: #7c3aed; --l2: #2563eb; --l3: #0f766e; --l4: #c2410c; --l5: #be185d; --l6: #047857; --on-lc: #ffffff;
  --ld1: #6d28d9; --ld2: #1d4ed8; --ld3: #0f766e; --ld4: #c2410c; --ld5: #be185d; --ld6: #047857;
  --glow-1: rgba(124, 58, 237, .16); --glow-2: rgba(37, 99, 235, .14); --glow-3: rgba(236, 72, 153, .10);
  --shadow: 0 1px 2px rgba(40, 30, 100, .05), 0 16px 36px -22px rgba(60, 40, 140, .35);
  --radius: 22px; --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f0e1a; --card: #181628; --card-2: #1f1d33; --soft: #2a2742; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --fg: #f1effb; --muted: #b3aed0; --dim: #9893b8;
  --accent: #9b85ff; --accent-2: #60a5fa; --on-accent: #ffffff; --accent-soft: rgba(155, 133, 255, .15); --accent-ink: #b9a8ff;
  --btn-a: #6d4aff; --btn-b: #2563eb;
  --ok: #34d399; --ok-soft: rgba(52, 211, 153, .12); --bad: #fb7185; --bad-soft: rgba(251, 113, 133, .12); --gold: #fbbf24; --on-bad: #2b0711;
  --l1: #a78bfa; --l2: #60a5fa; --l3: #2dd4bf; --l4: #fb923c; --l5: #f472b6; --l6: #34d399; --on-lc: #12101f;
  --glow-1: rgba(124, 58, 237, .22); --glow-2: rgba(37, 99, 235, .16); --glow-3: rgba(236, 72, 153, .10);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 40px -24px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: radial-gradient(700px 420px at 0% -80px, var(--glow-1), transparent 70%), radial-gradient(700px 420px at 100% 0%, var(--glow-2), transparent 70%), radial-gradient(800px 500px at 50% 110%, var(--glow-3), transparent 70%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--font); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.02em; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i--sm { width: 16px; height: 16px; } .i--lg { width: 26px; height: 26px; }
.i--fill { fill: currentColor; stroke: none; }
.wrap { max-width: 920px; margin: 0 auto; }

/* header + nav */
.top { position: sticky; top: 0; z-index: 30; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-left, 0px)) 0; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top__in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.brand__logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: none; }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.brand b span { color: var(--accent-ink); }
.stats { display: flex; align-items: center; gap: 6px; }
.stat { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.stat .i { width: 17px; height: 17px; }
.stat--xp .i { color: var(--gold); } .stat--fire .i { color: #fb923c; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--fg); border-color: var(--line-2); }
.nav { display: flex; gap: 4px; max-width: 920px; margin: 0 auto; padding-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
.nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 11px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.nav a:hover { color: var(--fg); background: var(--soft); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
.nav a[aria-current="page"] .i { color: var(--accent-ink); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: var(--on-bad); font-size: 11.5px; display: inline-grid; place-items: center; font-weight: 800; }
@media (max-width: 640px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); max-width: none; }
  .nav a { flex: 1; flex-direction: column; gap: 2px; font-size: 11.5px; padding: 6px 2px; min-height: 52px; justify-content: center; position: relative; }
  .nav a .badge { position: absolute; top: 2px; left: calc(50% + 6px); }
  body { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .brand b { font-size: 16px; }
  .stat { padding: 0 9px; }
  body.is-practice .nav { display: none; }
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .units { grid-template-columns: 1fr 1fr !important; }
  .nav a { font-size: 10.5px; }
  .hero h1 { font-size: 23px; }
}

/* generic */
main { padding-top: 22px; }
main:focus { outline: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--muted); }
.btn { min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0; background: linear-gradient(135deg, var(--btn-a), var(--btn-b)); color: var(--on-accent); font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 12px 28px -14px var(--accent); transition: transform .12s, filter .2s, opacity .2s; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; cursor: default; filter: none; box-shadow: none; }
.btn--ghost { background: var(--soft); color: var(--fg); box-shadow: none; }
.btn--ok { background: var(--ok); color: #fff; box-shadow: none; }
.btn--bad { background: var(--bad); color: #fff; box-shadow: none; }
:root[data-theme="dark"] .btn--ok { color: #04261a; } :root[data-theme="dark"] .btn--bad { color: #2b0711; }
.btn--wide { width: 100%; }
.btn--sm { min-height: 42px; padding: 0 16px; font-size: 14.5px; border-radius: 12px; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.speak { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--soft); color: var(--accent-ink); display: inline-grid; place-items: center; flex: none; }
.speak:hover { background: var(--accent-soft); }
.speak .i { width: 17px; height: 17px; }
b, strong { font-weight: 700; }

/* course map */
.hero { display: grid; gap: 16px; background: linear-gradient(120deg, #6d4aff, #2563eb); border: 0; color: #fff; position: relative; overflow: hidden; box-shadow: 0 24px 50px -24px rgba(79, 70, 229, .7); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 70%); pointer-events: none; }
.hero .eyebrow { color: rgba(255, 255, 255, .85); }
.hero p, .hero .overall { color: rgba(255, 255, 255, .9) !important; }
.hero .meter { background: rgba(255, 255, 255, .25); }
.hero .meter span { background: #fff; }
.hero .btn { background: #fff; color: #4c1fe0; box-shadow: 0 12px 26px -12px rgba(0, 0, 0, .45); position: relative; z-index: 1; }
@media (min-width: 720px) { .hero { grid-template-columns: 1fr auto; align-items: center; padding: 26px 28px; } }
.hero h1 { font-size: 26px; font-weight: 900; margin-top: 6px; }
.hero p { margin-top: 6px; color: var(--muted); }
.overall { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
.meter { flex: 1; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; max-width: 320px; }
.meter span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s cubic-bezier(.22, 1, .36, 1); }
.levels { display: grid; gap: 18px; margin-top: 22px; }
.level { position: relative; border-top: 4px solid var(--lc); }
.level__bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin: -6px 0 16px; }
.level__bar span { display: block; height: 100%; border-radius: inherit; background: var(--lc); }
.level__head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.level__code { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-weight: 900; font-size: 16px; background: var(--lc); color: var(--on-lc); flex: none; box-shadow: 0 10px 22px -12px var(--lc); }
.level.is-locked { border-top-color: var(--line-2); }
.level.is-locked .level__code { background: var(--soft); color: var(--dim); box-shadow: none; }
.level.is-done .level__pct { color: var(--ok); }
.level__head h2 { font-size: 19px; font-weight: 800; }
.level__head p { font-size: 13.5px; color: var(--muted); }
.level__head > div { flex: 1; min-width: 0; }
.level__pct { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tile { position: relative; display: grid; gap: 4px; align-content: start; text-align: left; min-height: 112px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg); text-decoration: none; transition: transform .15s, border-color .2s, background .2s; }
.tile:hover { transform: translateY(-2px); border-color: var(--lc, var(--line-2)); box-shadow: 0 12px 26px -18px var(--lc, transparent); }
.tile__n { font-size: 12px; font-weight: 800; color: var(--dim); letter-spacing: .06em; }
.tile__t { font-weight: 700; line-height: 1.3; font-size: 14.5px; }
.tile__s { display: flex; gap: 2px; margin-top: auto; color: color-mix(in srgb, var(--dim) 45%, transparent); }
.tile__s .on { color: #f59e0b; }
.tile.is-next { border: 2px solid var(--lc); background: linear-gradient(160deg, color-mix(in srgb, var(--lc) 14%, var(--card)), var(--card) 75%); }
.tile.is-next::after { content: "Сейчас"; position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--lc); color: var(--on-lc); }
.tile.is-locked { color: var(--dim); cursor: not-allowed; }
.tile.is-locked:hover { transform: none; border-color: var(--line); }
.tile.is-locked .tile__s { color: var(--dim); }
.tile--test { border-style: dashed; border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.tile--test .tile__n, .tile--test .tile__s { color: var(--gold); }
.tile--test.is-passed .tile__s { color: var(--ok); }
.tile--test.is-passed { border-style: solid; background: color-mix(in srgb, var(--ok) 8%, var(--card-2)); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }

/* lesson (theory) */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; padding: 6px 0; margin-bottom: 10px; }
.back:hover { color: var(--fg); }
.lesson-head { padding: 24px; border-radius: var(--radius); background: linear-gradient(120deg, var(--lcd, #6d28d9), #1e1b4b); color: #fff; box-shadow: 0 22px 44px -26px var(--lc); }
.lesson-head .eyebrow { color: rgba(255, 255, 255, .85); }
.lesson-head p { color: rgba(255, 255, 255, .92) !important; }
.lesson-head h1 { font-size: 28px; font-weight: 900; margin-top: 6px; }
.lesson-head p { color: var(--muted); margin-top: 6px; font-size: 16px; }
.theory { display: grid; gap: 14px; margin-top: 20px; }
.rule { display: grid; gap: 6px; }
.rule h3 { font-size: 15.5px; font-weight: 800; }
.rule p { color: var(--fg); }
.rule p b { color: var(--accent-ink); }
.formula { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 16px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 800; font-size: 16.5px; color: var(--fg); }
.formula .i { color: var(--accent-ink); }
.examples { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.examples li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); }
.examples .en { font-weight: 700; }
.examples .ru { color: var(--muted); font-size: 14px; }
.tip { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--gold) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); }
.tip .i { color: var(--gold); margin-top: 2px; }
.tip b { color: var(--gold); }
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.word { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); min-width: 0; }
.word div { min-width: 0; }
.word b { display: block; overflow-wrap: anywhere; }
.word span { color: var(--muted); font-size: 13.5px; }
.section-h { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 8px 0 -4px; }
.start-bar { position: sticky; bottom: 12px; margin-top: 22px; display: flex; gap: 10px; z-index: 5; }
.start-bar .btn { flex: 1; }
@media (max-width: 640px) { .start-bar { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }

/* videos */
.videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.video { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--fg); box-shadow: var(--shadow); transition: transform .15s, border-color .2s; }
.video:hover { transform: translateY(-2px); border-color: #ff0033; }
.video__play { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #e60026; color: #fff; flex: none; }
.video__play .i { width: 18px; height: 18px; fill: currentColor; }
.video--search .video__play { background: var(--soft); color: var(--accent-ink); }
.video--search .video__play .i { fill: none; }
.video b { display: block; font-size: 14.5px; line-height: 1.3; }
.video small { color: var(--muted); font-size: 12.5px; }
.trainer { display: grid; gap: 14px; background: linear-gradient(120deg, #0f766e, #2563eb); color: #fff; border: 0; }
.trainer p { color: rgba(255, 255, 255, .92); }
.trainer h2 { font-size: 20px; font-weight: 900; }
.trainer .btn { background: #fff; color: #0f4c81; box-shadow: none; }
@media (min-width: 720px) { .trainer { grid-template-columns: 1fr auto; align-items: center; } }

/* practice */
.p-top { display: flex; align-items: center; gap: 14px; }
.p-bar { flex: 1; height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.p-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--lc, var(--accent)), var(--accent-2)); transition: width .45s cubic-bezier(.22, 1, .36, 1); }
.p-count { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.task { margin-top: 26px; animation: slide-in .35s cubic-bezier(.22, 1, .36, 1); }
@keyframes slide-in { from { opacity: 0; transform: translateX(24px); } }
.task__kind { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.task__q { font-size: 24px; font-weight: 800; margin-top: 10px; line-height: 1.4; letter-spacing: -.01em; }
.task__q .gap { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--accent); margin: 0 4px; height: 1.1em; vertical-align: -0.15em; }
.task__ru { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 16px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 19px; font-weight: 700; }
.task__ru .i { color: var(--dim); }
.options { display: grid; gap: 10px; margin-top: 22px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; min-height: 58px; padding: 12px 16px; border-radius: 16px; border: 2px solid var(--line-2); background: var(--card); font-size: 17px; font-weight: 600; transition: border-color .15s, background .15s, transform .1s; }
.opt:hover { border-color: var(--accent); }
.opt kbd { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line-2); display: grid; place-items: center; font: 700 12.5px var(--font); color: var(--dim); flex: none; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer { width: 100%; margin-top: 22px; min-height: 58px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line-2); background: var(--card); font-size: 18px; font-weight: 600; resize: none; }
.answer:focus { outline: none; border-color: var(--accent); }
textarea.answer { min-height: 110px; }
.slot { min-height: 64px; margin-top: 22px; padding: 10px; border-radius: 16px; border: 2px dashed var(--line-2); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tok { min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); font-size: 17px; font-weight: 600; box-shadow: 0 2px 0 var(--line-2); transition: transform .1s, opacity .2s; }
.tok:hover { border-color: var(--accent); }
.tok:active { transform: translateY(1px); }
.tok.is-used { opacity: .25; pointer-events: none; box-shadow: none; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.match__col { display: grid; gap: 10px; align-content: start; }
.mt { min-height: 54px; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); font-weight: 600; font-size: 15.5px; text-align: center; transition: border-color .15s, background .15s, opacity .3s; }

.banner { display: flex; align-items: center; gap: 16px; padding: 24px; border-radius: var(--radius); background: linear-gradient(120deg, var(--lcd, #5b21b6), #1e1b4b); color: #fff; box-shadow: 0 22px 44px -26px var(--lc); }

mark { position: relative; background: color-mix(in srgb, var(--lc, var(--accent)) 16%, transparent); color: inherit; border-bottom: 2px dotted var(--lc, var(--accent)); border-radius: 4px; padding: 0 2px; cursor: help; }

.nb b { display: block; } .nb span { font-size: 13px; color: var(--muted); }
.quote { display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; font-style: italic; max-width: 520px; }
.cta-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.big { font-size: 30px; font-weight: 900; }

/* ================= v4 · vivid 3D visual layer ================= */
:root {
  --font: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --bg: #f4f1ff; --card: #ffffff; --card-2: #faf8ff; --soft: #efeaff; --line: rgba(76, 29, 149, .09); --line-2: rgba(76, 29, 149, .17);
  --fg: #170f3d; --muted: #544c7e; --dim: #5d5589;
  --accent: #7c3aed; --accent-2: #c026d3; --accent-ink: #6d28d9; --accent-soft: rgba(124, 58, 237, .10);
  --grad: linear-gradient(135deg, #7c3aed 0%, #c026d3 55%, #be185d 100%); --edge: #4c1d95;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow: 0 1px 2px rgba(76, 29, 149, .06), 0 22px 44px -26px rgba(76, 29, 149, .5);
}
:root[data-theme="dark"] {
  --bg: #100827; --card: #1b1140; --card-2: #23174f; --soft: #2f2366; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .16);
  --fg: #f6f3ff; --muted: #cbc3ef; --dim: #b0a8da;
  --accent: #a78bfa; --accent-ink: #c4b5fd; --accent-soft: rgba(167, 139, 250, .16); --edge: #2e1065;
  --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 22px 44px -24px rgba(0, 0, 0, .9);
}
html { background: var(--bg); }
body { background: transparent !important; font-family: var(--font); color: var(--fg); }

/* living background */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%; filter: blur(80px); opacity: .5; will-change: transform; animation: drift 26s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { background: #a78bfa; left: -22vmax; top: -28vmax; }
.aurora i:nth-child(2) { background: #f9a8d4; right: -26vmax; top: -12vmax; animation-duration: 32s; animation-delay: -6s; }
.aurora i:nth-child(3) { background: #67e8f9; left: 6vmax; bottom: -40vmax; opacity: .42; animation-duration: 38s; animation-delay: -12s; }
:root[data-theme="dark"] .aurora i { opacity: .34; }
:root[data-theme="dark"] .aurora i:nth-child(1) { background: #7c3aed; }
:root[data-theme="dark"] .aurora i:nth-child(2) { background: #db2777; }
:root[data-theme="dark"] .aurora i:nth-child(3) { background: #0891b2; }
@keyframes drift { to { transform: translate(9vmax, 7vmax) scale(1.18); } }

/* display type */
.hero4 h1, .banner h1, .page-h h1, .world h2, .world__code, .utile__t, .step b, .result h1, .reading__bar h2, .theory__h, .tgroup h2, .week h2, .brand b, .fcard b, .big, .r-stat b, .stat, .tcard b, .tbadge, .p-count, .fb b, .vcard b, .goalchip b { font-family: var(--display); letter-spacing: -.01em; }

/* header */
.top { background: rgba(255, 255, 255, .64); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); border-bottom: 1px solid rgba(255, 255, 255, .85); box-shadow: 0 14px 34px -28px rgba(76, 29, 149, .7); }
:root[data-theme="dark"] .top { background: rgba(16, 8, 39, .66); border-bottom-color: rgba(255, 255, 255, .06); }
.brand__logo { background: var(--grad); border-radius: 13px; box-shadow: inset 0 2px 1px rgba(255, 255, 255, .45), 0 4px 0 var(--edge), 0 12px 20px -8px rgba(192, 38, 211, .8); }
.brand b { font-size: 16px; font-weight: 700; }
.brand b span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="dark"] .brand b span { background-image: linear-gradient(135deg, #c4b5fd, #f9a8d4); }
.stat { height: 40px; padding: 0 12px 0 6px; gap: 7px; border-radius: 14px; background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 3px 0 rgba(76, 29, 149, .12), 0 10px 20px -14px rgba(76, 29, 149, .6); font-size: 13px; font-weight: 700; }
.stat .i { width: 28px; height: 28px; padding: 6px; border-radius: 9px; color: #fff; stroke-width: 2.4; }
.stat--fire .i { background: linear-gradient(145deg, #fdba74, #ea580c); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5), 0 2px 0 #9a3412; }
.stat--xp .i { background: linear-gradient(145deg, #fde047, #d97706); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5), 0 2px 0 #92400e; }
.icon-btn { border-radius: 14px; background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 3px 0 rgba(76, 29, 149, .12); }
:root[data-theme="dark"] .stat, :root[data-theme="dark"] .icon-btn { background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .08); box-shadow: none; }
.nav a { border-radius: 14px; transition: background .2s, color .2s; }
.nav a[aria-current="page"] { background: var(--grad); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), 0 4px 0 var(--edge), 0 12px 22px -12px rgba(192, 38, 211, .9); }
.nav a[aria-current="page"] .i { color: #fff; }

/* surfaces */
.card { border-radius: 26px; background: rgba(255, 255, 255, .88); border: 1px solid rgba(255, 255, 255, .95); box-shadow: var(--shadow); }
:root[data-theme="dark"] .card { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }

/* tactile 3D buttons */
.btn { position: relative; overflow: hidden; border-radius: 16px; background: var(--grad); color: #fff; font-weight: 800; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), 0 5px 0 var(--edge), 0 16px 28px -14px rgba(192, 38, 211, .75); transition: transform .12s var(--ease), box-shadow .12s, filter .2s; }
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .38) 50%, transparent 65%); transform: translateX(-120%); transition: transform .7s var(--ease); pointer-events: none; }
.btn:hover { filter: brightness(1.06) saturate(1.1); transform: translateY(-1px); }
.btn:hover::after { transform: translateX(120%); }
.btn:active { transform: translateY(4px); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), 0 1px 0 var(--edge), 0 6px 14px -8px rgba(192, 38, 211, .7); }
.btn--ghost { background: #fff; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line-2), 0 4px 0 #ddd6fe, 0 12px 22px -16px rgba(76, 29, 149, .5); }
.btn--ghost:active { box-shadow: inset 0 0 0 1.5px var(--line-2), 0 1px 0 #ddd6fe; }
:root[data-theme="dark"] .btn--ghost { background: var(--soft); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 4px 0 #160d38; }
.btn--ok { background: linear-gradient(135deg, #047857, #065f46); color: #fff !important; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .3), 0 5px 0 #064e3b, 0 16px 26px -14px rgba(5, 150, 105, .8); }
.btn--bad { background: linear-gradient(135deg, #e11d48, #be123c); color: #fff !important; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .3), 0 5px 0 #881337, 0 16px 26px -14px rgba(225, 29, 72, .8); }
.btn:disabled { filter: grayscale(.5); opacity: .5; transform: none; box-shadow: 0 4px 0 var(--line-2); }
.btn:disabled::after { display: none; }

/* glossy clay 3D icon */
.i3d { --s: 52px; position: relative; width: var(--s); height: var(--s); flex: none; display: grid; place-items: center; color: #fff; border-radius: calc(var(--s) * .32);
  background: linear-gradient(150deg, var(--c1, #c4b5fd) 0%, var(--c2, #7c3aed) 72%);
  box-shadow: inset 0 calc(var(--s) * .04) 1px rgba(255, 255, 255, .55), inset 0 calc(var(--s) * -.1) calc(var(--s) * .18) rgba(0, 0, 0, .18), 0 calc(var(--s) * .1) 0 var(--c3, #4c1d95), 0 calc(var(--s) * .32) calc(var(--s) * .42) calc(var(--s) * -.18) var(--c2, #7c3aed); }
.i3d::before { content: ""; position: absolute; left: 14%; right: 14%; top: 7%; height: 40%; border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%; background: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, 0)); }
.i3d .i { position: relative; width: 48%; height: 48%; stroke-width: 2.3; filter: drop-shadow(0 2px 1.5px rgba(0, 0, 0, .28)); }
.i3d--sm { --s: 40px; } .i3d--lg { --s: 74px; } .i3d--xl { --s: 134px; }
.step .i3d, .qcard .i3d { color: #fff; }
.i3d.is-lock { --c1: rgba(255, 255, 255, .55); --c2: rgba(255, 255, 255, .2); --c3: rgba(0, 0, 0, .14); }

/* floating 3D decorations */
.deco { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; border-radius: inherit; }
.orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #fff 0 5%, var(--o1, rgba(255, 255, 255, .95)) 20%, var(--o2, rgba(255, 255, 255, .45)) 66%, var(--o3, rgba(255, 255, 255, .1)) 100%); box-shadow: inset -10px -14px 26px rgba(0, 0, 0, .2), 0 26px 44px -20px rgba(0, 0, 0, .45); animation: float 7s ease-in-out infinite; }
.ring3d { position: absolute; border-radius: 50%; border: 12px solid; border-color: rgba(255, 255, 255, .95) rgba(255, 255, 255, .55) rgba(255, 255, 255, .16) rgba(255, 255, 255, .7); transform: rotateX(64deg) rotateZ(25deg); filter: drop-shadow(0 14px 14px rgba(0, 0, 0, .25)); animation: tumble 14s linear infinite; }
.hero4 .ring3d { border-color: #fde68a #f59e0b #92400e #fbbf24; }
@keyframes tumble { to { transform: rotateX(64deg) rotateZ(385deg); } }
.spark { position: absolute; width: 20px; height: 20px; background: #fff; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); filter: drop-shadow(0 0 6px rgba(255, 255, 255, .9)); animation: twinkle 2.8s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .35; transform: scale(.5) rotate(45deg); } }
.float { animation: float 5.5s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -10px; rotate: -2deg; } }

/* entrance */
.rise { animation: rise .7s var(--ease) var(--d, 0ms) backwards; }
@keyframes rise { from { opacity: 0; translate: 0 22px; scale: .98; } }
@keyframes popin { from { scale: .3; opacity: 0; } }

/* hero */
.hero.hero4 { position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 22px; padding: 30px; border-radius: 34px; color: #fff; border: 0; margin-top: 4px;
  background: radial-gradient(110% 130% at 100% 0%, rgba(244, 114, 182, .55), transparent 55%), radial-gradient(80% 110% at 90% 110%, rgba(34, 211, 238, .5), transparent 55%), linear-gradient(135deg, #5b21b6 0%, #6d28d9 45%, #4338ca 100%);
  box-shadow: 0 34px 70px -34px rgba(91, 33, 182, .85), inset 0 1px 0 rgba(255, 255, 255, .25); }
.hero.hero4::after { display: none; }
@media (min-width: 760px) { .hero.hero4 { grid-template-columns: 1fr 250px; align-items: center; min-height: 290px; padding: 38px 42px; } }
.hero4__main { position: relative; z-index: 1; max-width: 580px; }
.hero4 .eyebrow { color: rgba(255, 255, 255, .92); font-size: 12px; letter-spacing: .12em; }
.hero4 h1 { font-size: clamp(25px, 3.3vw, 36px); line-height: 1.12; margin-top: 10px; font-weight: 700; color: #fff; }
.hero4 p { margin-top: 12px; color: rgba(255, 255, 255, .94) !important; font-weight: 600; font-size: 15.5px; }
.hero4 .hero__cta { margin-top: 22px; }
.hero4 .btn { background: #fff; color: #4c1d95; box-shadow: inset 0 -2px 0 rgba(76, 29, 149, .12), 0 5px 0 rgba(20, 8, 60, .45), 0 18px 30px -14px rgba(0, 0, 0, .55); }
.hero4__side { position: relative; z-index: 1; display: grid; justify-items: center; gap: 20px; }
.goalchip { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 20px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .32); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.goalchip b { display: block; font-size: 14px; }
.goalchip span { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .92); }
.goalchip__fire { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; padding: 6px 10px; border-radius: 12px; background: linear-gradient(145deg, #c2410c, #9a3412); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), 0 3px 0 #7c2d12; font-family: var(--display); font-size: 13px !important; color: #fff !important; }
.goalchip__fire .i { width: 16px; height: 16px; }
.hero4 .ring__bg { stroke: rgba(255, 255, 255, .25); } .hero4 .ring__fg { stroke: #fff; }

/* quick cards */
.quick { gap: 14px; margin-top: 18px; }
.qcard { gap: 14px; padding: 14px 16px; border-radius: 22px; background: rgba(255, 255, 255, .9); border: 1px solid #fff; box-shadow: 0 5px 0 rgba(76, 29, 149, .08), var(--shadow); transition: transform .25s var(--ease), box-shadow .25s; }
.qcard > .i { width: 20px; height: 20px; padding: 0; background: none; color: var(--dim); margin-left: auto; }
.qcard > div { flex: 1; min-width: 0; }
:root[data-theme="dark"] .qcard { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }

/* level worlds */
.levels { gap: 26px; margin-top: 26px; }
.world { position: relative; overflow: hidden; isolation: isolate; padding: 26px; border-radius: 34px; color: #fff; background: var(--wg); border: 0; box-shadow: 0 34px 64px -34px var(--ws), inset 0 1px 0 rgba(255, 255, 255, .25); }
.world__head { position: relative; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.world__head > div { flex: 1; min-width: 190px; }
.world__code { width: 66px; height: 66px; border-radius: 22px; display: grid; place-items: center; font-size: 20px; font-weight: 800; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .42); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .45), 0 6px 0 rgba(0, 0, 0, .18), 0 16px 26px -14px rgba(0, 0, 0, .5); }
.world h2 { font-size: clamp(19px, 2.4vw, 24px); font-weight: 700; color: #fff; }
.world__head p { margin-top: 4px; font-weight: 600; font-size: 14px; color: rgba(255, 255, 255, .94); }
.world__pct { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px; font-family: var(--display); font-size: 14px; font-weight: 700; background: #fff; color: var(--wb, #6d28d9); border: 0; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .06), 0 4px 0 rgba(0, 0, 0, .18), 0 14px 24px -12px rgba(0, 0, 0, .55); }
.world__bar { position: relative; height: 12px; margin: 20px 0; border-radius: 999px; background: rgba(0, 0, 0, .18); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .2); overflow: hidden; }
.world__bar span { display: block; height: 100%; min-width: 12px; border-radius: inherit; background: linear-gradient(90deg, #fff, #fde68a); box-shadow: 0 0 14px rgba(255, 255, 255, .9); }
.world__lock { display: flex; align-items: center; gap: 8px; margin: -4px 0 16px; font-weight: 700; color: #fff; }
.world .units { position: relative; gap: 14px; }
.world .utile { min-height: 174px; padding: 16px; border: 0; border-radius: 24px; background: rgba(255, 255, 255, .97); color: var(--fg); box-shadow: 0 6px 0 rgba(0, 0, 0, .14), 0 22px 34px -20px rgba(0, 0, 0, .55); transition: transform .25s var(--ease), box-shadow .25s; transform-style: preserve-3d; }
.world .utile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(240px circle at var(--mx, 50%) var(--my, -20%), rgba(255, 255, 255, .85), transparent 45%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.world .utile:hover::before { opacity: .55; }
.world .utile:hover { box-shadow: 0 10px 0 rgba(0, 0, 0, .14), 0 30px 44px -22px rgba(0, 0, 0, .6); }
.world .utile .i3d { margin-bottom: 12px; }
.world .utile__n { color: var(--dim); }
.world .utile__t { font-size: 14.5px; font-weight: 700; color: var(--fg); }
.world .utile__en { color: var(--muted); }
.world .dots i { height: 7px; background: var(--soft); }
.world .dots i.on { background: linear-gradient(90deg, var(--c1), var(--c2)); box-shadow: 0 0 8px var(--c1); }
.world .utile.is-next { box-shadow: 0 0 0 3px #fff, 0 0 0 9px rgba(255, 255, 255, .28), 0 6px 0 rgba(0, 0, 0, .14), 0 26px 40px -18px rgba(0, 0, 0, .6); }
.world .utile.is-next.rise { animation: rise .7s var(--ease) var(--d, 0ms) backwards, glow 2.4s ease-in-out 1s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px #fff, 0 0 0 15px rgba(255, 255, 255, .1), 0 6px 0 rgba(0, 0, 0, .14), 0 26px 40px -18px rgba(0, 0, 0, .6); } }
.world .utile.is-next::after { content: "Сейчас"; top: 14px; right: 14px; padding: 4px 10px; font-size: 11.5px; font-weight: 800; border-radius: 999px; background: linear-gradient(135deg, #fde047, #f59e0b); color: #422006; box-shadow: 0 3px 0 #b45309; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { translate: 0 -3px; } }
.utile__ok { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #34d399, #059669); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5), 0 3px 0 #065f46; }
.utile__ok .i { width: 16px; height: 16px; stroke-width: 3; }
.world .utile.is-locked { background: rgba(255, 255, 255, .13); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28); }
.world .utile.is-locked .utile__n, .world .utile.is-locked .utile__t, .world .utile.is-locked .utile__en { color: rgba(255, 255, 255, .92); }
.world .utile.is-locked .dots i { background: rgba(255, 255, 255, .22); }
.world .utile--test:not(.is-locked) { box-shadow: inset 0 0 0 2px #f59e0b, 0 6px 0 rgba(0, 0, 0, .14), 0 22px 34px -20px rgba(0, 0, 0, .55); }
.world .utile--test:not(.is-locked) .utile__n { color: #92400e; }
.world .utile--test.is-passed .utile__n { color: #047857; }
:root[data-theme="dark"] .world .utile:not(.is-locked) { background: rgba(14, 7, 36, .62); color: #fff; }
:root[data-theme="dark"] .world .utile:not(.is-locked) .utile__t { color: #fff; }
:root[data-theme="dark"] .world .utile:not(.is-locked) .utile__n, :root[data-theme="dark"] .world .utile:not(.is-locked) .utile__en { color: rgba(255, 255, 255, .82); }
:root[data-theme="dark"] .world .utile--test:not(.is-locked) .utile__n { color: #fde68a; }
:root[data-theme="dark"] .world .utile--test.is-passed .utile__n { color: #6ee7b7; }
:root[data-theme="dark"] .world .dots i { background: rgba(255, 255, 255, .16); }

/* unit + tense banner */
.banner { position: relative; overflow: hidden; isolation: isolate; gap: 20px; padding: 28px; border-radius: 34px; background: var(--world); box-shadow: 0 30px 60px -32px rgba(76, 29, 149, .8), inset 0 1px 0 rgba(255, 255, 255, .25); }
.banner > div:not(.deco) { position: relative; z-index: 1; }
.banner h1 { font-size: clamp(22px, 3vw, 32px); font-weight: 700; }
.banner .i3d { z-index: 1; }

/* unit steps */
.steps { gap: 16px; margin-top: 22px; }
.step { position: relative; gap: 16px; padding: 18px 18px 18px 20px; border-radius: 26px; background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 6px 0 rgba(76, 29, 149, .08), var(--shadow); transition: transform .25s var(--ease), box-shadow .25s; }
.step b { font-size: 16px; font-weight: 700; }
.step__n { position: absolute; top: -9px; left: -9px; width: 30px; height: 30px; font-size: 13px; font-weight: 900; color: #fff; background: var(--grad); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .45), 0 3px 0 var(--edge); z-index: 2; }
.step__n .i { width: 16px; height: 16px; stroke-width: 3; }
.step .step__n { color: #fff; font-size: 13px; }
.step.is-done .step__n { background: linear-gradient(145deg, #34d399, #059669); box-shadow: 0 3px 0 #065f46; color: #fff; }
:root[data-theme="dark"] .step { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
.goals li { border-radius: 18px; background: rgba(255, 255, 255, .86); border-color: #fff; }
:root[data-theme="dark"] .goals li { background: var(--card); border-color: rgba(255, 255, 255, .07); }
.goals .i { width: 22px; height: 22px; padding: 4px; border-radius: 50%; color: #fff; background: linear-gradient(145deg, #34d399, #059669); margin-top: 0; }

/* page headers */
.page-h4 { display: flex; align-items: center; gap: 18px; margin-top: 6px; }
.page-h4 h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; }
.page-h4 p { max-width: 720px; }

/* tenses */
.tgroup h2 { gap: 12px; font-weight: 700; }
.tbadge { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; color: #fff; font-size: 14px; font-weight: 800; box-shadow: inset 0 2px 1px rgba(255, 255, 255, .4), 0 4px 0 rgba(0, 0, 0, .22); }
.tcard { padding: 0; gap: 0; overflow: hidden; border-radius: 24px; background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 6px 0 rgba(76, 29, 149, .08), var(--shadow); transition: transform .25s var(--ease), box-shadow .25s; }
.tcard .tl { padding: 30px 6px 2px; background: linear-gradient(160deg, color-mix(in srgb, var(--lc) 20%, #fff), #fff 80%); }
.tcard > div { padding: 10px 16px 16px; }

:root[data-theme="dark"] .tcard { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
:root[data-theme="dark"] .tcard .tl { background: linear-gradient(160deg, color-mix(in srgb, var(--lc) 28%, #1b1140), #1b1140 80%); }
.tl__dot { filter: drop-shadow(0 3px 5px rgba(245, 158, 11, .7)); }
.tl-wrap { border-radius: 22px; background: linear-gradient(160deg, color-mix(in srgb, var(--lc) 14%, #fff), #fff 75%); border-color: #fff; }
:root[data-theme="dark"] .tl-wrap { background: var(--card-2); border-color: rgba(255, 255, 255, .07); }
.frow, .examples li { border-radius: 18px; background: rgba(255, 255, 255, .85); }
