<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LevelUp English</title>
<meta name="description" content="Курс английского как учебник: 30 тематических разделов A1–B1 со словами, текстами, грамматикой и письмом, все 13 времён, карточки слов и награды.">
<meta name="theme-color" content="#f5f3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Calm dark workspace, one violet accent for actions, gold only for rewards (XP, stars). */
/* Bright by default: airy lavender canvas, white cards, a violet→blue accent and one colour per level. */
:root {
  --bg: #f5f3ff; --card: #ffffff; --card-2: #faf9ff; --soft: #eeebfb; --line: rgba(60, 40, 140, .10); --line-2: rgba(60, 40, 140, .18);
  --fg: #1c1640; --muted: #575380; --dim: #67638c;
  --accent: #6d4aff; --accent-2: #2563eb; --on-accent: #ffffff; --accent-soft: rgba(109, 74, 255, .10); --accent-ink: #5532e8;
  --btn-a: #6d4aff; --btn-b: #2563eb;
  --ok: #047857; --ok-soft: rgba(4, 120, 87, .10); --bad: #be123c; --bad-soft: rgba(190, 18, 60, .08); --gold: #92400e; --on-bad: #ffffff;
  --l1: #7c3aed; --l2: #2563eb; --l3: #0f766e; --l4: #c2410c; --l5: #be185d; --l6: #047857; --on-lc: #ffffff;
  --ld1: #6d28d9; --ld2: #1d4ed8; --ld3: #0f766e; --ld4: #c2410c; --ld5: #be185d; --ld6: #047857;
  --glow-1: rgba(124, 58, 237, .16); --glow-2: rgba(37, 99, 235, .14); --glow-3: rgba(236, 72, 153, .10);
  --shadow: 0 1px 2px rgba(40, 30, 100, .05), 0 16px 36px -22px rgba(60, 40, 140, .35);
  --radius: 22px; --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f0e1a; --card: #181628; --card-2: #1f1d33; --soft: #2a2742; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --fg: #f1effb; --muted: #b3aed0; --dim: #9893b8;
  --accent: #9b85ff; --accent-2: #60a5fa; --on-accent: #ffffff; --accent-soft: rgba(155, 133, 255, .15); --accent-ink: #b9a8ff;
  --btn-a: #6d4aff; --btn-b: #2563eb;
  --ok: #34d399; --ok-soft: rgba(52, 211, 153, .12); --bad: #fb7185; --bad-soft: rgba(251, 113, 133, .12); --gold: #fbbf24; --on-bad: #2b0711;
  --l1: #a78bfa; --l2: #60a5fa; --l3: #2dd4bf; --l4: #fb923c; --l5: #f472b6; --l6: #34d399; --on-lc: #12101f;
  --glow-1: rgba(124, 58, 237, .22); --glow-2: rgba(37, 99, 235, .16); --glow-3: rgba(236, 72, 153, .10);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 40px -24px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: radial-gradient(700px 420px at 0% -80px, var(--glow-1), transparent 70%), radial-gradient(700px 420px at 100% 0%, var(--glow-2), transparent 70%), radial-gradient(800px 500px at 50% 110%, var(--glow-3), transparent 70%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--font); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.02em; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i--sm { width: 16px; height: 16px; } .i--lg { width: 26px; height: 26px; }
.i--fill { fill: currentColor; stroke: none; }
.wrap { max-width: 920px; margin: 0 auto; }

/* header + nav */
.top { position: sticky; top: 0; z-index: 30; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-left, 0px)) 0; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top__in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.brand__logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: none; }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.brand b span { color: var(--accent-ink); }
.stats { display: flex; align-items: center; gap: 6px; }
.stat { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.stat .i { width: 17px; height: 17px; }
.stat--xp .i { color: var(--gold); } .stat--fire .i { color: #fb923c; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--fg); border-color: var(--line-2); }
.nav { display: flex; gap: 4px; max-width: 920px; margin: 0 auto; padding-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
.nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 11px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.nav a:hover { color: var(--fg); background: var(--soft); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
.nav a[aria-current="page"] .i { color: var(--accent-ink); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: var(--on-bad); font-size: 11.5px; display: inline-grid; place-items: center; font-weight: 800; }
@media (max-width: 640px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); max-width: none; }
  .nav a { flex: 1; flex-direction: column; gap: 2px; font-size: 11.5px; padding: 6px 2px; min-height: 52px; justify-content: center; position: relative; }
  .nav a .badge { position: absolute; top: 2px; left: calc(50% + 6px); }
  body { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .brand b { font-size: 16px; }
  .stat { padding: 0 9px; }
  body.is-practice .nav { display: none; }
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .units { grid-template-columns: 1fr 1fr !important; }
  .nav a { font-size: 10.5px; }
  .hero h1 { font-size: 23px; }
}

/* generic */
main { padding-top: 22px; }
main:focus { outline: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--muted); }
.btn { min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0; background: linear-gradient(135deg, var(--btn-a), var(--btn-b)); color: var(--on-accent); font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 12px 28px -14px var(--accent); transition: transform .12s, filter .2s, opacity .2s; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; cursor: default; filter: none; box-shadow: none; }
.btn--ghost { background: var(--soft); color: var(--fg); box-shadow: none; }
.btn--ok { background: var(--ok); color: #fff; box-shadow: none; }
.btn--bad { background: var(--bad); color: #fff; box-shadow: none; }
:root[data-theme="dark"] .btn--ok { color: #04261a; } :root[data-theme="dark"] .btn--bad { color: #2b0711; }
.btn--wide { width: 100%; }
.btn--sm { min-height: 42px; padding: 0 16px; font-size: 14.5px; border-radius: 12px; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.speak { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--soft); color: var(--accent-ink); display: inline-grid; place-items: center; flex: none; }
.speak:hover { background: var(--accent-soft); }
.speak .i { width: 17px; height: 17px; }
b, strong { font-weight: 700; }

/* course map */
.hero { display: grid; gap: 16px; background: linear-gradient(120deg, #6d4aff, #2563eb); border: 0; color: #fff; position: relative; overflow: hidden; box-shadow: 0 24px 50px -24px rgba(79, 70, 229, .7); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 70%); pointer-events: none; }
.hero .eyebrow { color: rgba(255, 255, 255, .85); }
.hero p, .hero .overall { color: rgba(255, 255, 255, .9) !important; }
.hero .meter { background: rgba(255, 255, 255, .25); }
.hero .meter span { background: #fff; }
.hero .btn { background: #fff; color: #4c1fe0; box-shadow: 0 12px 26px -12px rgba(0, 0, 0, .45); position: relative; z-index: 1; }
@media (min-width: 720px) { .hero { grid-template-columns: 1fr auto; align-items: center; padding: 26px 28px; } }
.hero h1 { font-size: 26px; font-weight: 900; margin-top: 6px; }
.hero p { margin-top: 6px; color: var(--muted); }
.overall { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
.meter { flex: 1; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; max-width: 320px; }
.meter span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s cubic-bezier(.22, 1, .36, 1); }
.levels { display: grid; gap: 18px; margin-top: 22px; }
.level { position: relative; border-top: 4px solid var(--lc); }
.level__bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin: -6px 0 16px; }
.level__bar span { display: block; height: 100%; border-radius: inherit; background: var(--lc); }
.level__head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.level__code { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-weight: 900; font-size: 16px; background: var(--lc); color: var(--on-lc); flex: none; box-shadow: 0 10px 22px -12px var(--lc); }
.level.is-locked { border-top-color: var(--line-2); }
.level.is-locked .level__code { background: var(--soft); color: var(--dim); box-shadow: none; }
.level.is-done .level__pct { color: var(--ok); }
.level__head h2 { font-size: 19px; font-weight: 800; }
.level__head p { font-size: 13.5px; color: var(--muted); }
.level__head > div { flex: 1; min-width: 0; }
.level__pct { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tile { position: relative; display: grid; gap: 4px; align-content: start; text-align: left; min-height: 112px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg); text-decoration: none; transition: transform .15s, border-color .2s, background .2s; }
.tile:hover { transform: translateY(-2px); border-color: var(--lc, var(--line-2)); box-shadow: 0 12px 26px -18px var(--lc, transparent); }
.tile__n { font-size: 12px; font-weight: 800; color: var(--dim); letter-spacing: .06em; }
.tile__t { font-weight: 700; line-height: 1.3; font-size: 14.5px; }
.tile__s { display: flex; gap: 2px; margin-top: auto; color: color-mix(in srgb, var(--dim) 45%, transparent); }
.tile__s .on { color: #f59e0b; }
.tile.is-next { border: 2px solid var(--lc); background: linear-gradient(160deg, color-mix(in srgb, var(--lc) 14%, var(--card)), var(--card) 75%); }
.tile.is-next::after { content: "Сейчас"; position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--lc); color: var(--on-lc); }
.tile.is-locked { color: var(--dim); cursor: not-allowed; }
.tile.is-locked:hover { transform: none; border-color: var(--line); }
.tile.is-locked .tile__s { color: var(--dim); }
.tile--test { border-style: dashed; border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.tile--test .tile__n, .tile--test .tile__s { color: var(--gold); }
.tile--test.is-passed .tile__s { color: var(--ok); }
.tile--test.is-passed { border-style: solid; background: color-mix(in srgb, var(--ok) 8%, var(--card-2)); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }

/* lesson (theory) */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; padding: 6px 0; margin-bottom: 10px; }
.back:hover { color: var(--fg); }
.lesson-head { padding: 24px; border-radius: var(--radius); background: linear-gradient(120deg, var(--lcd, #6d28d9), #1e1b4b); color: #fff; box-shadow: 0 22px 44px -26px var(--lc); }
.lesson-head .eyebrow { color: rgba(255, 255, 255, .85); }
.lesson-head p { color: rgba(255, 255, 255, .92) !important; }
.lesson-head h1 { font-size: 28px; font-weight: 900; margin-top: 6px; }
.lesson-head p { color: var(--muted); margin-top: 6px; font-size: 16px; }
.theory { display: grid; gap: 14px; margin-top: 20px; }
.rule { display: grid; gap: 6px; }
.rule h3 { font-size: 15.5px; font-weight: 800; }
.rule p { color: var(--fg); }
.rule p b { color: var(--accent-ink); }
.formula { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 16px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 800; font-size: 16.5px; color: var(--fg); }
.formula .i { color: var(--accent-ink); }
.examples { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.examples li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); }
.examples .en { font-weight: 700; }
.examples .ru { color: var(--muted); font-size: 14px; }
.tip { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--gold) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); }
.tip .i { color: var(--gold); margin-top: 2px; }
.tip b { color: var(--gold); }
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.word { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); min-width: 0; }
.word div { min-width: 0; }
.word b { display: block; overflow-wrap: anywhere; }
.word span { color: var(--muted); font-size: 13.5px; }
.section-h { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 8px 0 -4px; }
.start-bar { position: sticky; bottom: 12px; margin-top: 22px; display: flex; gap: 10px; z-index: 5; }
.start-bar .btn { flex: 1; }
@media (max-width: 640px) { .start-bar { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }

/* videos */
.videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.video { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--fg); box-shadow: var(--shadow); transition: transform .15s, border-color .2s; }
.video:hover { transform: translateY(-2px); border-color: #ff0033; }
.video__play { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #e60026; color: #fff; flex: none; }
.video__play .i { width: 18px; height: 18px; fill: currentColor; }
.video--search .video__play { background: var(--soft); color: var(--accent-ink); }
.video--search .video__play .i { fill: none; }
.video b { display: block; font-size: 14.5px; line-height: 1.3; }
.video small { color: var(--muted); font-size: 12.5px; }
.trainer { display: grid; gap: 14px; background: linear-gradient(120deg, #0f766e, #2563eb); color: #fff; border: 0; }
.trainer p { color: rgba(255, 255, 255, .92); }
.trainer h2 { font-size: 20px; font-weight: 900; }
.trainer .btn { background: #fff; color: #0f4c81; box-shadow: none; }
@media (min-width: 720px) { .trainer { grid-template-columns: 1fr auto; align-items: center; } }

/* practice */
.p-top { display: flex; align-items: center; gap: 14px; }
.p-bar { flex: 1; height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.p-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--lc, var(--accent)), var(--accent-2)); transition: width .45s cubic-bezier(.22, 1, .36, 1); }
.p-count { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.task { margin-top: 26px; animation: slide-in .35s cubic-bezier(.22, 1, .36, 1); }
@keyframes slide-in { from { opacity: 0; transform: translateX(24px); } }
.task__kind { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.task__q { font-size: 24px; font-weight: 800; margin-top: 10px; line-height: 1.4; letter-spacing: -.01em; }
.task__q .gap { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--accent); margin: 0 4px; height: 1.1em; vertical-align: -0.15em; }
.task__ru { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 16px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 19px; font-weight: 700; }
.task__ru .i { color: var(--dim); }
.options { display: grid; gap: 10px; margin-top: 22px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; min-height: 58px; padding: 12px 16px; border-radius: 16px; border: 2px solid var(--line-2); background: var(--card); font-size: 17px; font-weight: 600; transition: border-color .15s, background .15s, transform .1s; }
.opt:hover { border-color: var(--accent); }
.opt kbd { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line-2); display: grid; place-items: center; font: 700 12.5px var(--font); color: var(--dim); flex: none; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer { width: 100%; margin-top: 22px; min-height: 58px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line-2); background: var(--card); font-size: 18px; font-weight: 600; resize: none; }
.answer:focus { outline: none; border-color: var(--accent); }
textarea.answer { min-height: 110px; }
.slot { min-height: 64px; margin-top: 22px; padding: 10px; border-radius: 16px; border: 2px dashed var(--line-2); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tok { min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); font-size: 17px; font-weight: 600; box-shadow: 0 2px 0 var(--line-2); transition: transform .1s, opacity .2s; }
.tok:hover { border-color: var(--accent); }
.tok:active { transform: translateY(1px); }
.tok.is-used { opacity: .25; pointer-events: none; box-shadow: none; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.match__col { display: grid; gap: 10px; align-content: start; }
.mt { min-height: 54px; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); font-weight: 600; font-size: 15.5px; text-align: center; transition: border-color .15s, background .15s, opacity .3s; }
.mt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

.p-actions { position: sticky; bottom: 0; margin: 26px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }

/* results */

.stars { display: flex; gap: 8px; }

.stars .on:nth-child(2) { animation-delay: .15s; } .stars .on:nth-child(3) { animation-delay: .3s; }
@keyframes star { from { transform: scale(.3) rotate(-30deg); opacity: 0; } }
.r-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 480px; }

/* reference + words */
.search { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--card); margin: 16px 0; }

.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }

.page-h h1 { font-size: 26px; font-weight: 900; }

.empty { text-align: center; color: var(--muted); padding: 30px 10px; display: grid; gap: 14px; justify-items: center; }

.foot { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 34px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px); opacity: 0; pointer-events: none; z-index: 60; padding: 12px 18px; border-radius: 14px; background: var(--fg); color: var(--bg); font-weight: 700; box-shadow: 0 16px 36px -12px rgba(0, 0, 0, .5); transition: opacity .25s, transform .25s; max-width: calc(100vw - 32px); }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ===== textbook layout ===== */

.banner { display: flex; align-items: center; gap: 16px; padding: 24px; border-radius: var(--radius); background: linear-gradient(120deg, var(--lcd, #5b21b6), #1e1b4b); color: #fff; box-shadow: 0 22px 44px -26px var(--lc); }

mark { position: relative; background: color-mix(in srgb, var(--lc, var(--accent)) 16%, transparent); color: inherit; border-bottom: 2px dotted var(--lc, var(--accent)); border-radius: 4px; padding: 0 2px; cursor: help; }
mark:hover::after, mark:focus::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; padding: 6px 10px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 700; font-style: normal; z-index: 5; pointer-events: none; }
.theory { margin-top: 18px; }

.tl { width: 100%; height: auto; display: block; }

.flash { margin-top: 26px; display: grid; gap: 18px; justify-items: center; }

.wstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 18px 0; }

.lvl { margin-left: auto; font-size: 10px; letter-spacing: 1px; color: var(--ok); white-space: nowrap; }

.week { margin-top: 4px; }

.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 160px; margin-top: 14px; align-items: end; }
.bar { height: 100%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 4px; }

.result { position: relative; overflow: hidden; }
