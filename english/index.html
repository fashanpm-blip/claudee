.fsign { background: var(--grad); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .4), 0 3px 0 var(--edge); }

/* theory blocks */
.formula { border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, #8b5cf6 16%, #fff), color-mix(in srgb, #f472b6 12%, #fff)); border: 1px solid #fff; box-shadow: 0 4px 0 rgba(76, 29, 149, .08); }
:root[data-theme="dark"] .formula { background: var(--soft); border-color: transparent; }
.tip, .vs { border-radius: 20px; }
.speak { width: 38px; height: 38px; border-radius: 12px; background: var(--grad); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .4), 0 3px 0 var(--edge); transition: transform .1s, filter .2s; }
.speak:hover { background: var(--grad); filter: brightness(1.1); }
.speak:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.vcard { position: relative; overflow: hidden; border-radius: 22px; background: rgba(255, 255, 255, .92); border: 1px solid #fff; padding: 16px 16px 16px 20px; box-shadow: 0 5px 0 rgba(76, 29, 149, .07), var(--shadow); }
.vcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--grad); }
.vcard b { font-size: 16.5px; font-weight: 700; }
:root[data-theme="dark"] .vcard { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
.video { border-radius: 20px; background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 5px 0 rgba(76, 29, 149, .07), var(--shadow); }
:root[data-theme="dark"] .video { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
.video__play { border-radius: 14px; background: linear-gradient(145deg, #ff4d6d, #e60023); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .4), 0 3px 0 #9f0019; }
.video--search .video__play { background: var(--soft); box-shadow: none; }
details.ref { border-radius: 22px; background: rgba(255, 255, 255, .9); border-color: #fff; box-shadow: var(--shadow); }
:root[data-theme="dark"] details.ref { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
.search { border-radius: 18px; background: rgba(255, 255, 255, .92); border-color: #fff; box-shadow: var(--shadow); }
:root[data-theme="dark"] .search { background: var(--card); border-color: rgba(255, 255, 255, .08); }

/* reading + writing */
.reading, .write { border-radius: 30px; }
.reading__text { font-size: 18.5px; }
mark { background: linear-gradient(transparent 52%, color-mix(in srgb, #f472b6 45%, transparent) 52%); border-bottom: 0; border-radius: 3px; font-weight: 700; color: inherit; }
.chip { background: color-mix(in srgb, #8b5cf6 12%, #fff); color: var(--accent-ink); }
:root[data-theme="dark"] .chip { background: var(--soft); color: var(--fg); }
.checklist li .i { width: 22px; height: 22px; padding: 4px; border-radius: 50%; background: color-mix(in srgb, var(--bad) 14%, transparent); }
.checklist li.ok .i { background: linear-gradient(145deg, #34d399, #059669); color: #fff; }
.answer { border-radius: 20px; background: rgba(255, 255, 255, .96); box-shadow: inset 0 2px 4px rgba(76, 29, 149, .06); }
.answer:focus { border-color: #8b5cf6; box-shadow: 0 0 0 5px rgba(139, 92, 246, .16); }

/* practice */
.p-bar { height: 18px; background: var(--soft); box-shadow: inset 0 2px 4px rgba(76, 29, 149, .14); }
.p-bar span { position: relative; background: linear-gradient(90deg, #8b5cf6, #d946ef 60%, #f472b6); box-shadow: 0 0 16px rgba(217, 70, 239, .55); }
.p-bar span::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, .5); }
.task__kind { display: inline-flex; padding: 7px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); letter-spacing: .05em; }
.task__q { font-size: clamp(22px, 3vw, 28px); }
.task__q .gap { border-bottom: 4px solid #c026d3; border-radius: 2px; }
.opt { border: 2px solid var(--line-2); border-bottom-width: 5px; border-radius: 20px; background: rgba(255, 255, 255, .96); transition: transform .12s, border-color .15s, background .15s, box-shadow .15s; }
.opt:hover { transform: translateY(-2px); border-color: #c4b5fd; }
.opt:active { transform: translateY(2px); border-bottom-width: 3px; }
.opt kbd { width: 30px; height: 30px; border: 0; border-radius: 10px; background: var(--soft); color: var(--accent-ink); font: 800 13px var(--display); }
.opt[aria-checked="true"] { border-color: #8b5cf6; background: color-mix(in srgb, #8b5cf6 10%, var(--card)); box-shadow: 0 0 0 5px rgba(139, 92, 246, .14); }
.opt[aria-checked="true"] kbd { background: var(--grad); color: #fff; }
.opt.is-right { border-color: #10b981; background: color-mix(in srgb, #10b981 14%, var(--card)); animation: hop .5s var(--spring); }
.opt.is-right kbd { background: #047857; color: #fff; }
.opt.is-wrong { border-color: #f43f5e; background: color-mix(in srgb, #f43f5e 11%, var(--card)); }
.opt.is-wrong kbd { background: #be123c; color: #fff; }
@keyframes hop { 40% { translate: 0 -8px; } }
.tok, .mt { border-bottom-width: 4px; border-radius: 16px; background: rgba(255, 255, 255, .96); }
.mt[aria-pressed="true"] { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139, 92, 246, .15); }
:root[data-theme="dark"] .opt, :root[data-theme="dark"] .mt, :root[data-theme="dark"] .tok, :root[data-theme="dark"] .answer { background: var(--card); }
.task__ru { border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, #8b5cf6 12%, #fff), #fff); border-color: #fff; box-shadow: var(--shadow); }
:root[data-theme="dark"] .task__ru { background: var(--card); border-color: rgba(255, 255, 255, .07); }
.p-actions { transition: background .3s, border-color .3s; }
.p-actions.is-ok { background: color-mix(in srgb, #10b981 16%, var(--bg)); border-top-color: rgba(16, 185, 129, .45); }
.p-actions.is-bad { background: color-mix(in srgb, #f43f5e 13%, var(--bg)); border-top-color: rgba(244, 63, 94, .45); }
:root:not([data-theme="dark"]) .p-actions.is-ok .fb.ok b { color: #065f46; }
:root:not([data-theme="dark"]) .p-actions.is-bad .fb.bad b { color: #9f1239; }
.fb__ic { width: 54px; height: 54px; box-shadow: inset 0 2px 1px rgba(255, 255, 255, .45), 0 4px 0 rgba(0, 0, 0, .2); animation: popin .5s var(--spring); }
.fb__ic .i { width: 26px; height: 26px; stroke-width: 3; }
.fb.ok .fb__ic, :root[data-theme="dark"] .fb.ok .fb__ic { background: linear-gradient(145deg, #34d399, #059669); color: #fff; }
.fb.bad .fb__ic, :root[data-theme="dark"] .fb.bad .fb__ic { background: linear-gradient(145deg, #fb7185, #e11d48); color: #fff; }
.fb b { font-size: 18px; font-weight: 700; }

/* results */
.result { overflow: hidden; isolation: isolate; padding: 42px 24px 30px; }
.result > * { position: relative; z-index: 1; }
.result > .rays { position: absolute; z-index: 0; top: -120px; left: 50%; width: 580px; height: 580px; margin-left: -290px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(250, 204, 21, .28) 0 8deg, transparent 8deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 14%, transparent 62%); mask-image: radial-gradient(circle, #000 14%, transparent 62%); animation: spin 26s linear infinite; pointer-events: none; }
@keyframes spin { to { rotate: 360deg; } }
.illo { width: 250px; filter: drop-shadow(0 24px 26px rgba(76, 29, 149, .32)); animation: popin .8s var(--spring), float 5s 1s ease-in-out infinite; }
.result h1 { font-size: clamp(22px, 3.2vw, 32px); font-weight: 700; }
.r-stat { border-radius: 22px; background: rgba(255, 255, 255, .96); border: 1px solid #fff; box-shadow: 0 5px 0 rgba(76, 29, 149, .08), 0 16px 26px -18px rgba(76, 29, 149, .5); }
:root[data-theme="dark"] .r-stat { background: var(--card-2); border-color: rgba(255, 255, 255, .07); box-shadow: none; }
.r-stat b { font-size: 23px; font-weight: 700; }
.r-stats { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); max-width: 580px; }
.r-stats .r-stat { animation: popin .6s var(--spring) backwards; }
.r-stats .r-stat:nth-child(2) { animation-delay: .1s; } .r-stats .r-stat:nth-child(3) { animation-delay: .2s; } .r-stats .r-stat:nth-child(4) { animation-delay: .3s; }
.badge-card { border-radius: 24px; background: rgba(255, 255, 255, .92); border-color: #fff; transition: transform .25s var(--ease); }
.badge-card:not(.is-locked):hover { transform: translateY(-4px) rotate(-1deg); }
:root[data-theme="dark"] .badge-card { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
.bar__col { background: linear-gradient(180deg, #c4b5fd, #8b5cf6); }
.bar.hit .bar__col { background: var(--grad); box-shadow: 0 0 16px rgba(192, 38, 211, .5); }

/* flashcards */
.fcard { height: 290px; }
.fcard > span { border-radius: 30px; }
.fcard__front { background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box; border: 3px solid transparent; box-shadow: 0 8px 0 rgba(76, 29, 149, .1), 0 30px 50px -26px rgba(124, 58, 237, .6); }
.fcard__back { background: radial-gradient(120% 120% at 100% 0%, rgba(244, 114, 182, .5), transparent 55%), linear-gradient(135deg, #6d28d9, #4338ca); box-shadow: 0 8px 0 #2e1065, 0 30px 50px -26px rgba(76, 29, 149, .8); }
.fcard b { font-size: 32px; font-weight: 700; }

@media (max-width: 640px) {
  .top { background: rgba(255, 255, 255, .95); }
  :root[data-theme="dark"] .top { background: rgba(16, 8, 39, .96); }
  .nav { background: rgba(255, 255, 255, .97); border-top: 1px solid #fff; box-shadow: 0 -14px 30px -24px rgba(76, 29, 149, .6); }
  :root[data-theme="dark"] .nav { background: rgba(27, 17, 64, .97); border-top-color: rgba(255, 255, 255, .06); }
  .nav a[aria-current="page"] { background: transparent; color: var(--accent-ink); box-shadow: none; }
  .nav a[aria-current="page"] .i { width: 34px; height: 34px; padding: 8px; border-radius: 12px; background: var(--grad); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .4), 0 3px 0 var(--edge); }
  .hero.hero4 { padding: 26px 20px; border-radius: 28px; }
  .i3d--xl { --s: 104px; }
  .world { padding: 20px 14px; border-radius: 28px; }
  .world .utile { min-height: 160px; padding: 14px 12px; }
  .world .utile__t { font-size: 13px; }
  .banner { padding: 22px 18px; border-radius: 28px; }
  .banner .i3d--lg { --s: 60px; }
  .page-h4 .i3d--lg { --s: 56px; }
  .top { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .brand b { font-size: 15px; line-height: 1.05; }
  .brand b span { display: block; font-size: 11.5px; letter-spacing: .02em; }
  .hero4 .eyebrow { display: block; padding-right: 58px; }
  .hero4 .deco .d1 { width: 132px !important; height: 132px !important; right: -52px !important; top: -62px !important; }
  .hero4 .deco .d2, .hero4 .deco .d3, .hero4 .deco .d4 { display: none; }
  .world .deco .d1 { width: 104px !important; height: 104px !important; right: -36px !important; top: -62px !important; }
  .r-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) { .world .deco .d2, .world .deco .d4 { display: none; } }
/* ================= v5 · «Зачем английский»: scroll-driven 3D book + more motion ================= */
.hand { font-family: "Caveat", "Segoe Print", "Comic Sans MS", cursive; font-weight: 700; }

/* hero: second (glass) button, parallax orbs, 3D icon turns to the mouse, CTA shine */
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero4 .btn--glass { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5), 0 5px 0 rgba(20, 8, 60, .35), 0 16px 28px -16px rgba(0, 0, 0, .5); }
.hero4 .btn--glass:active { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5), 0 1px 0 rgba(20, 8, 60, .35); }
.hero4 .deco .orb { transform: translate3d(calc(var(--px, 0) * var(--pz, 28px)), calc(var(--py, 0) * var(--pz, 28px)), 0); transition: transform .7s var(--ease); }
.hero4 .deco .orb.d2 { --pz: -36px; }
.hero4__side .i3d--xl { transform: perspective(600px) rotateY(calc(var(--px, 0) * 30deg)) rotateX(calc(var(--py, 0) * -22deg)); transition: transform .5s var(--ease); }
.hero4 .hero__cta .btn:not(.btn--glass)::after, .why__cta::after { background: linear-gradient(110deg, transparent 35%, rgba(167, 139, 250, .5) 50%, transparent 65%); animation: autoshine 4.2s var(--ease) 1.4s infinite; }
@keyframes autoshine { 0%, 62% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

/* icons wiggle on hover */
.qcard:hover .i3d, .step:hover .i3d, .utile:not(.is-locked):hover .i3d, .tcard:hover .tl { animation: wiggle .75s var(--spring); }
@keyframes wiggle { 25% { rotate: -12deg; scale: 1.12; } 55% { rotate: 8deg; scale: 1.05; } 80% { rotate: -3deg; } }
.tcard:hover .tl { animation-name: tlpop; }
@keyframes tlpop { 40% { scale: 1.04; } }

/* things below the fold appear when they scroll into view */
.rise.rv, .rise.rv * { animation-play-state: paused !important; }
.world__bar span { transform-origin: 0 50%; animation: barfill 1.4s var(--ease) .35s backwards; }
@keyframes barfill { from { transform: scaleX(0); } }
.ring__fg { animation: ringdraw 1.3s var(--ease) .3s backwards; }
@keyframes ringdraw { from { stroke-dashoffset: 264; } }
.goalchip__fire .i { transform-origin: 50% 85%; animation: flicker 1.7s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { scale: 1; rotate: -4deg; } 50% { scale: 1.12 .94; rotate: 4deg; } }

/* XP chip jumps after a practice; correct answer sends a ripple */
.stat { position: relative; }
.stat.bump { animation: bump .8s var(--spring); }
@keyframes bump { 30% { scale: 1.18; } }
.xp-fly { position: absolute; left: 50%; top: 100%; z-index: 2; padding: 3px 9px; border-radius: 999px; background: linear-gradient(135deg, #fde047, #f59e0b); color: #422006; font: 800 12px var(--display); white-space: nowrap; pointer-events: none; box-shadow: 0 3px 0 #b45309; translate: -50% 0; animation: xpfly 1.4s var(--ease) forwards; }
@keyframes xpfly { 0% { opacity: 0; translate: -50% 12px; scale: .5; } 22% { opacity: 1; translate: -50% 6px; scale: 1.08; } 72% { opacity: 1; translate: -50% 10px; scale: 1; } 100% { opacity: 0; translate: -50% 30px; } }
.fb__ic { position: relative; }
.fb.ok .fb__ic::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #34d399; animation: ripple .8s ease-out forwards; }
@keyframes ripple { from { opacity: 1; scale: .8; } to { opacity: 0; scale: 1.7; } }

/* ---------- the «why» section: a pinned stage, chapters on the left, the book on the right ---------- */
.why { --pin-h: calc(100vh - var(--top-h, 114px) - 24px); --why-len: 240vh; position: relative; height: calc(var(--pin-h) + var(--why-len)); margin-top: 26px; }
.why__pin { position: sticky; top: calc(var(--top-h, 114px) + 12px); height: var(--pin-h); min-height: 440px; }
.why__stage { position: relative; isolation: isolate; overflow: hidden; height: 100%; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 14px; padding: 34px 40px 28px; border-radius: 34px; color: #fff;
  background: radial-gradient(40% 52% at 75% 48%, rgba(253, 224, 71, .36), transparent 70%), radial-gradient(50% 60% at 0% 0%, rgba(56, 189, 248, .3), transparent 62%), linear-gradient(140deg, #3b0764 0%, #6d28d9 46%, #c026d3 100%);
  box-shadow: 0 40px 80px -40px rgba(109, 40, 217, .85), inset 0 1px 0 rgba(255, 255, 255, .22); }
.why__text { position: relative; z-index: 1; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.why__chs { display: grid; align-items: center; min-height: 0; }
.why__ch { grid-area: 1 / 1; opacity: 0; translate: 0 34px; filter: blur(6px); transition: opacity .45s var(--ease), translate .7s var(--ease), filter .45s; pointer-events: none; }
.why__ch.is-past { translate: 0 -34px; }
.why__ch.is-on { opacity: 1; translate: 0 0; filter: none; pointer-events: auto; transition-delay: .1s; }
.why__k { display: inline-flex; align-items: center; gap: 9px; padding: 5px 14px 5px 5px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .32); font: 700 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.why__k .i3d { --s: 32px; }
.why__k > .i { margin-left: 6px; }
.why__ch h2, .why__ch h3 { margin-top: 16px; font: 700 clamp(26px, 3.1vw, 40px)/1.08 var(--display); letter-spacing: -.015em; color: #fff; text-wrap: balance; }
.why__ch em { font-style: normal; background: linear-gradient(90deg, #fde68a, #fbbf24 30%, #fff7d6 50%, #fbbf24 70%, #fde68a) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 3.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.why__ch p { margin-top: 16px; max-width: 470px; font-size: 16.5px; line-height: 1.62; font-weight: 600; color: rgba(255, 255, 255, .96); }
.why__ch small { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .86); }
.why__hint { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; font-weight: 700; font-size: 14px; color: #fff; }
.why__hint i { position: relative; width: 22px; height: 34px; border: 2px solid rgba(255, 255, 255, .9); border-radius: 12px; }
.why__hint i::after { content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 7px; margin-left: -2px; border-radius: 2px; background: #fff; animation: wheel 1.6s ease-in-out infinite; }
@keyframes wheel { 0% { opacity: 0; translate: 0 -2px; } 30% { opacity: 1; } 100% { opacity: 0; translate: 0 12px; } }
.why__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 14px; }
.why__dots { display: flex; }
.why__dots button { width: 22px; height: 28px; padding: 0; border: 0; background: none; display: grid; place-items: center; transition: width .35s var(--ease); }
.why__dots button::before { content: ""; width: 9px; height: 9px; border-radius: 99px; background: rgba(255, 255, 255, .42); transition: width .35s var(--ease), background .35s; }
.why__dots button:hover::before { background: rgba(255, 255, 255, .75); }
.why__dots button[aria-current="step"] { width: 36px; }
.why__dots button[aria-current="step"]::before { width: 26px; background: #fff; box-shadow: 0 0 12px rgba(255, 255, 255, .85); }
.why__dots button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; border-radius: 8px; }
.btn.why__cta { background: #fff; color: #4c1d95; box-shadow: inset 0 -2px 0 rgba(76, 29, 149, .12), 0 5px 0 rgba(20, 8, 60, .45), 0 18px 30px -14px rgba(0, 0, 0, .55); }
.why[data-s="6"] .why__cta { animation: ctapulse 1.6s ease-in-out infinite; }
@keyframes ctapulse { 50% { box-shadow: inset 0 -2px 0 rgba(76, 29, 149, .12), 0 5px 0 rgba(20, 8, 60, .45), 0 0 0 10px rgba(255, 255, 255, .24); } }

/* ---------- the book ---------- */
.why__bookwrap { position: relative; z-index: 1; display: grid; place-items: center; min-height: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.book { --bw: clamp(150px, min(16.5vw, calc((var(--pin-h) - 120px) / 1.34)), 214px); --bh: calc(var(--bw) * 1.34); --bt: calc(var(--bw) * .075);
  position: relative; width: calc(var(--bw) * 2); height: var(--bh); perspective: calc(var(--bw) * 7); perspective-origin: 50% 25%; font-size: calc(var(--bw) / 15); line-height: 1.3; animation: bookfloat 6s ease-in-out infinite; }
@keyframes bookfloat { 50% { translate: 0 -10px; } }
.book__body { position: absolute; left: 50%; top: 0; width: var(--bw); height: var(--bh); transform-style: preserve-3d; transform-origin: 0 50%; }
.book__body > *, .leaf > * { position: absolute; }
.bk-back { top: -.3em; height: calc(100% + .6em); width: calc(100% + .45em); border-radius: .25em .6em .6em .25em; background: linear-gradient(150deg, #1d4ed8, #172554); transform: translateZ(-3px); }
.bk-back--r { left: 0; }
.bk-back--l { right: 100%; border-radius: .6em .25em .25em .6em; opacity: var(--lo, 0); }
.bk-block { top: 0; width: 100%; height: 100%; transform-style: preserve-3d; }
.bk-block > * { position: absolute; }
.bk-block--r { left: 0; }
.bk-block--l { right: 100%; }
.bk-block--l > * { opacity: var(--lo, 0); }
.bk-top { inset: 0; transform: translateZ(var(--bt)); }
.bk-edge { position: absolute; transform-origin: 0 0; }
.bk-edge--r, .bk-edge--l { top: 0; width: var(--bt); height: 100%; transform: rotateY(-90deg); background: repeating-linear-gradient(90deg, #fbf6ea 0 2px, #e1d4b8 2px 3px); }
.bk-edge--r { left: 100%; }
.bk-edge--l { left: 0; }
.bk-edge--b, .bk-edge--t { left: 0; width: 100%; height: var(--bt); transform: rotateX(90deg); background: repeating-linear-gradient(180deg, #fbf6ea 0 2px, #e1d4b8 2px 3px); }
.bk-edge--b { top: 100%; }
.bk-edge--t { top: 0; }
.bk-spine { left: 0; top: -.3em; width: calc(var(--bt) + 14px); height: calc(100% + .6em); transform-origin: 0 0; transform: translateZ(-3px) rotateY(-90deg); border-radius: .2em;
  background: linear-gradient(180deg, transparent 10%, #fbbf24 10% 11.5%, transparent 11.5% 88.5%, #fbbf24 88.5% 90%, transparent 90%), linear-gradient(90deg, #0f1d4a, #1e3a8a 45%, #0f1d4a); }
.bk-ribbon { left: 87%; top: 16%; width: .7em; height: calc(var(--bh) * .95); transform: translateZ(calc(var(--bt) + 1px)); background: linear-gradient(90deg, #9f1239, #e11d48 45%, #be123c); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 93%, 0 100%); }
.leaf { left: 0; top: 0; width: 100%; height: 100%; transform-style: preserve-3d; transform-origin: 0 50%; }
.leaf--cover { top: -.3em; width: calc(100% + .45em); height: calc(100% + .6em); }
.lf { inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.lf--b { transform: rotateY(180deg); }
.lf::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: calc(var(--sh, 0) * .95); }
.lf--f::after { background: linear-gradient(90deg, rgba(60, 30, 0, .34), rgba(60, 30, 0, .06) 60%, rgba(255, 255, 255, .14)); }
.lf--b::after { background: linear-gradient(270deg, rgba(60, 30, 0, .34), rgba(60, 30, 0, .06) 60%, rgba(255, 255, 255, .14)); }

/* cover: navy leather, gold foil, a sheen that runs over it */
.bk-cover { border-radius: .25em .6em .6em .25em; background: radial-gradient(130% 90% at 85% 0%, rgba(255, 255, 255, .22), transparent 45%), radial-gradient(90% 70% at 0% 100%, rgba(56, 189, 248, .25), transparent 60%), linear-gradient(150deg, #1d4ed8 0%, #1e3a8a 42%, #172554 100%);
  box-shadow: inset .5em 0 .6em -.35em rgba(0, 0, 0, .55), inset -.12em 0 0 rgba(255, 255, 255, .18); }
.bk-cover__frame { position: absolute; inset: .85em .85em .85em 1.15em; display: grid; align-content: center; justify-items: center; gap: .6em; padding: .6em; text-align: center; border: .1em solid rgba(251, 191, 36, .85); border-radius: .45em; box-shadow: inset 0 0 0 .28em rgba(251, 191, 36, .14); }
.bk-cover__top { font: 700 .55em var(--display); letter-spacing: .3em; color: #fde68a; }
.bk-cover__t { font: 800 1.75em/1.02 var(--display); background: linear-gradient(180deg, #fff7d6 10%, #fbbf24 55%, #d97706); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .08em 0 rgba(0, 0, 0, .45)); }
.bk-cover__s { font-size: .62em; font-weight: 700; letter-spacing: .06em; color: #fde68a; }
.bk-cover__shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .34) 46%, transparent 62%); translate: -120% 0; animation: sheen 5s ease-in-out infinite; }
@keyframes sheen { 0%, 50% { translate: -120% 0; } 80%, 100% { translate: 120% 0; } }

/* pages: warm paper with a gutter shadow, content scales with the book (em) */
.pg { color: #2a2150; font-family: var(--font); }
.pg--r, .bk-top { border-radius: 0 .45em .45em 0; background: linear-gradient(90deg, #e6dbc2 0, #f8f2e4 7%, #fffdf7 30%, #fffaf0 100%); }
.pg--l { border-radius: .45em 0 0 .45em; background: linear-gradient(270deg, #e6dbc2 0, #f8f2e4 7%, #fffdf7 30%, #fffaf0 100%); }
.pg--inside { background: radial-gradient(circle at 30% 20%, rgba(196, 181, 253, .4), transparent 55%), repeating-linear-gradient(45deg, #f5efff 0 .6em, #ece3ff .6em 1.2em); }
.pg__in { position: absolute; inset: 1.1em 1.15em 1.7em 1.3em; display: flex; flex-direction: column; align-items: flex-start; gap: .55em; }
.pg--l .pg__in { inset: 1.1em 1.3em 1.7em 1.15em; }
.bk-top .pg__in { right: 2.1em; }
.pg__in--c { align-items: center; justify-content: center; text-align: center; }
.pg__n { position: absolute; bottom: .75em; font: 700 .62em var(--display); color: #6b5d42; }
.pg--r .pg__n { right: 1.15em; } .pg--l .pg__n { left: 1.15em; } .bk-top .pg__n { right: 2.6em; }
.pg__k { font: 700 .58em/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: #a16207; }
.pg__t { font: 700 1.08em/1.15 var(--display); color: #1e1550; }
.pg .hand { margin-top: auto; font-size: 1.22em; line-height: 1.05; color: #be185d; rotate: -3deg; }
.pg__in--c .hand { margin-top: .2em; }
.book .i3d { --s: calc(var(--bw) / 15 * 2.3); color: #fff; }
.book .i3d.big { --s: calc(var(--bw) / 15 * 3.6); }
.pg__stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5em .6em; width: 100%; margin-top: .25em; }
.pg__stats div { padding: .5em .55em; border-radius: .6em; background: #f3eefe; box-shadow: inset 0 -.15em 0 rgba(109, 40, 217, .12); }
.pg__stats b { display: block; font: 800 1.42em/1 var(--display); background: linear-gradient(135deg, #7c3aed, #db2777); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pg__stats span { display: block; margin-top: .25em; font-size: .62em; font-weight: 700; line-height: 1.2; color: #4c3f75; }
.pg__path { position: relative; display: grid; gap: .55em; width: 100%; margin-top: .3em; }
.pg__path div { position: relative; display: flex; align-items: center; gap: .65em; font-size: .86em; font-weight: 800; color: #2a2150; }
.pg__path div:nth-child(2) { margin-left: .7em; } .pg__path div:nth-child(3) { margin-left: 1.4em; } .pg__path div:nth-child(4) { margin-left: 2.1em; }
.pg__memo { width: 100%; height: auto; margin-top: .3em; overflow: visible; }
.pg__bc { display: grid; justify-items: center; gap: .8em; width: 100%; }
.bcard { width: 100%; display: grid; gap: .25em; padding: .85em .9em; border-radius: .55em; text-align: left; background: linear-gradient(135deg, #172554, #1e3a8a); color: #fff; box-shadow: 0 .5em 1em -.4em rgba(23, 37, 84, .7); rotate: -4deg; }
.bcard b { font: 700 .95em var(--display); color: #fff; }
.bcard span { font-size: .6em; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #fde68a; }
.bcard i { font-style: normal; font-size: .7em; font-weight: 700; color: #bfdbfe; }
.pg__list { display: grid; gap: .5em; margin: .2em 0 0; padding: 0; list-style: none; font-size: .8em; font-weight: 700; color: #2a2150; }
.pg__list li { display: flex; align-items: center; gap: .55em; }
.pg__list li::before { content: "✓"; flex: none; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: .45em; background: linear-gradient(145deg, #34d399, #059669); color: #fff; font-size: .8em; box-shadow: 0 .15em 0 #047857; }
.pg__big { font: 800 2em/1 var(--display); background: linear-gradient(135deg, #7c3aed, #db2777 60%, #d97706); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pg__cap { max-width: 11em; font-size: .78em; font-weight: 700; line-height: 1.3; color: #4c3f75; }
.pg__donut { width: 6em; height: 6em; }
.pg__stamps { display: flex; flex-wrap: wrap; gap: .55em .45em; margin-top: .3em; }
.pg__stamps i { padding: .45em .6em; border: .16em solid var(--c); border-radius: .45em; font: 800 .6em/1 var(--display); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 7%, transparent); rotate: var(--r); }
.pg__icons { display: grid; grid-template-columns: 1fr 1fr; gap: .6em .5em; width: 100%; margin-top: .3em; }
.pg__icons span { display: flex; align-items: center; gap: .45em; font-size: .78em; font-weight: 800; color: #2a2150; }
.pg__quote { display: grid; gap: .55em; justify-items: center; }
.pg__quote span { height: .55em; font: 800 3.4em/1 Georgia, "Times New Roman", serif; color: #7c3aed; }
.pg__quote b { font: 700 1em/1.3 var(--display); color: #1e1550; }
.pg__quote em { font-style: normal; font-size: .7em; font-weight: 800; letter-spacing: .04em; color: #a16207; }
.pg__win { align-self: center; margin: .4em 0 0; }
.exlib { display: grid; justify-items: center; gap: .45em; width: 100%; padding: 1em .8em; border-radius: .6em; text-align: center; background: #fffdf7; border: .14em solid #d8b4fe; box-shadow: 0 .4em 1em -.5em rgba(76, 29, 149, .45); rotate: -2deg; }
.exlib small { font: 800 .55em var(--display); letter-spacing: .2em; text-transform: uppercase; color: #6d28d9; }
.exlib span { font-size: .72em; font-weight: 700; color: #4c3f75; }
.exlib .hand { font-size: 1.9em; line-height: 1; color: #be185d; }
.exlib em { font-style: normal; font-size: .62em; font-weight: 600; color: #574c7a; }

/* soft shadow on the "table" and sparkles when a page turns */
.book__floor { position: absolute; left: 50%; top: 100%; width: calc(var(--bw) * (1.05 + var(--o, 0) * .95)); height: calc(var(--bw) * .16); margin-top: calc(var(--bw) * -.03); translate: -50% 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(15, 5, 40, .55), transparent); filter: blur(5px); }
.book__fx { position: absolute; left: 75%; top: 42%; width: 0; height: 0; z-index: 5; pointer-events: none; }
.burst i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; background: var(--c); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: burst 1.1s cubic-bezier(.2, .7, .3, 1) var(--dl, 0s) both; }
@keyframes burst { from { transform: translate(0, 0) scale(0) rotate(0); opacity: 1; } 70% { opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(var(--k)) rotate(220deg); opacity: 0; } }

/* reduced motion: no pinning, the book lies open, every chapter is listed */
.why--static { height: auto; }
.why--static .why__pin { position: relative; top: 0; height: auto; min-height: 0; }
.why--static .why__stage { height: auto; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.why--static .why__bookwrap { order: -1; padding: 10px 0 30px; }
.why--static .why__chs { gap: 30px; }
.why--static .why__ch { grid-area: auto; opacity: 1; translate: none; filter: none; }
.why--static .why__dots, .why--static .why__hint { display: none; }

@media (max-width: 760px) {
  .why { --pin-h: calc(100vh - var(--top-h, 64px) - var(--nav-h, 76px) - 22px); --why-len: 300vh; margin-top: 22px; }
  .why__pin { min-height: 400px; }
  .why__stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 4px; padding: 12px 18px 14px; border-radius: 28px;
    background: radial-gradient(70% 42% at 50% 26%, rgba(253, 224, 71, .34), transparent 70%), radial-gradient(60% 40% at 0% 0%, rgba(56, 189, 248, .28), transparent 60%), linear-gradient(185deg, #c026d3 0%, #7e22ce 38%, #4c1d95 70%, #3b0764 100%); }
  .why__bookwrap { order: -1; }
  .book { --bw: clamp(104px, min(38vw, calc((var(--pin-h) - 300px) / 1.34)), 150px); }
  .why__chs { align-items: start; }
  .why__ch h2, .why__ch h3 { margin-top: 10px; font-size: 21px; }
  .why__ch p { margin-top: 8px; font-size: 14px; line-height: 1.5; }
  .why__ch small { margin-top: 6px; font-size: 11px; }
  .why__k { font-size: 10.5px; } .why__k .i3d { --s: 26px; }
  .why__hint { margin-top: 10px; font-size: 13px; }
  .why__foot { padding-top: 8px; gap: 8px; }
  .why__dots button { width: 18px; } .why__dots button[aria-current="step"] { width: 32px; }
  .btn.why__cta { min-height: 44px; padding: 0 16px; font-size: 14.5px; }
  .why .deco .d2, .why .deco .d3 { display: none; }
  .why .deco .d1 { width: 120px !important; height: 120px !important; right: -44px !important; top: -52px !important; }
  .hero__cta .btn { flex: 1 1 auto; justify-content: center; }
}
@media (max-width: 760px) and (max-height: 700px) {
  .why__ch h2, .why__ch h3 { font-size: 18px; }
  .why__ch p { font-size: 13px; }
  .why__hint, .why__ch small { display: none; }
}
@supports (height: 100svh) {
  .why { --pin-h: calc(100svh - var(--top-h, 114px) - 24px); }
  @media (max-width: 760px) { .why { --pin-h: calc(100svh - var(--top-h, 64px) - var(--nav-h, 76px) - 22px); --why-len: 300svh; } }
}
/* ================= v6 · practice hub, listening, mascot, dialogs, speaking ================= */
/* mascot «Лекси» */
.lexi { display: block; flex: none; width: var(--lx, 64px); height: auto; overflow: visible; }
.lexi__body { transform-box: fill-box; transform-origin: 50% 100%; animation: lexibob 2.8s ease-in-out infinite; }
.lexi__eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
.lexi__wave { transform-box: fill-box; transform-origin: 0 100%; animation: armwave 1s ease-in-out infinite; }
.lexi--cheer .lexi__body { animation: lexijump 1s var(--spring) 2, lexibob 2.8s ease-in-out 2s infinite; }
.lexi--sad .lexi__body { animation: lexisad .55s ease-in-out; }
@keyframes lexibob { 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 45%, 49%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
@keyframes armwave { 50% { transform: rotate(-20deg); } }
@keyframes lexijump { 35% { transform: translateY(-16px) rotate(-5deg); } 60% { transform: translateY(0) rotate(3deg); } }
@keyframes lexisad { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.say { display: flex; align-items: flex-end; gap: 12px; width: 100%; max-width: 560px; margin: 4px auto 0; text-align: left; }
.say .lexi { --lx: 70px; }
.say__b { position: relative; flex: 1; padding: 12px 16px; border-radius: 20px 20px 20px 6px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; color: var(--fg); animation: popin .5s var(--spring) .3s backwards; }
.say__b::before { content: ""; position: absolute; left: -7px; bottom: 10px; width: 14px; height: 14px; background: inherit; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.fb__lx { margin-left: auto; align-self: center; }
.fb__lx .lexi { --lx: 52px; }
@media (max-width: 640px) { .fb__lx .lexi { --lx: 40px; } }

/* daily task card + placement offer */
.daily { position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; gap: 18px; margin-top: 18px; padding: 16px 22px; border-radius: 28px; color: #fff;
  background: radial-gradient(60% 120% at 100% 0%, rgba(255, 255, 255, .18), transparent 60%), linear-gradient(135deg, #0f766e, #0e7490 55%, #1d4ed8); box-shadow: 0 26px 50px -30px rgba(14, 116, 144, .9), inset 0 1px 0 rgba(255, 255, 255, .25); }
.daily .lexi { --lx: 78px; }
.daily__main { flex: 1; min-width: 0; }
.daily .eyebrow { color: rgba(255, 255, 255, .92); }
.daily h2 { margin-top: 4px; font: 700 clamp(17px, 2.2vw, 22px)/1.2 var(--display); color: #fff; }
.daily p { margin-top: 4px; font-weight: 600; color: rgba(255, 255, 255, .95); }
.btn.daily__btn { background: #fff; color: #0f766e; box-shadow: 0 5px 0 rgba(4, 47, 46, .45), 0 14px 24px -14px rgba(0, 0, 0, .5); }
.daily__ok { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .5); }
.daily__ok .i { width: 26px; height: 26px; stroke-width: 3; }
.plban { position: relative; display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px 18px 12px 12px; border-radius: 24px; text-decoration: none; color: var(--fg); background: rgba(255, 255, 255, .9); border: 1px solid #fff; box-shadow: 0 6px 0 rgba(76, 29, 149, .08), var(--shadow); }
.plban .lexi { --lx: 54px; }
.plban div { flex: 1; } .plban b { display: block; font: 700 15px var(--display); } .plban span { font-size: 13.5px; color: var(--muted); }
:root[data-theme="dark"] .plban { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }
@media (max-width: 640px) { .daily { flex-wrap: wrap; gap: 12px; padding: 16px; } .daily .lexi { --lx: 56px; } .daily__main { flex-basis: calc(100% - 80px); } .btn.daily__btn { width: 100%; justify-content: center; } }

/* practice hub */
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; margin-top: 18px; }
.pcard { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 16px; border-radius: 24px; text-decoration: none; color: var(--fg); background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 6px 0 rgba(76, 29, 149, .08), var(--shadow); transition: transform .25s var(--ease); }
.pcard b { display: block; font: 700 15.5px var(--display); } .pcard span { font-size: 13px; color: var(--muted); }
.pcard > .i { color: var(--dim); }
.pcard .i3d--lg { --s: 58px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.dcard { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 22px; text-decoration: none; color: var(--fg); background: rgba(255, 255, 255, .92); border: 1px solid #fff; box-shadow: 0 5px 0 rgba(76, 29, 149, .07), var(--shadow); transition: transform .25s var(--ease); }
.dcard b { display: block; font: 700 14.5px var(--display); } .dcard div > span:last-child { font-size: 12.5px; color: var(--muted); }
.dcard__lv { display: inline-block; margin-bottom: 2px; padding: 1px 7px; border-radius: 999px; font: 700 10.5px var(--display); background: var(--soft); color: var(--accent-ink); }
.dcard__ok { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #047857; color: #fff; }
.dcard__ok .i { width: 14px; height: 14px; stroke-width: 3; }
.dcard.is-done { box-shadow: inset 0 0 0 2px #10b981, 0 5px 0 rgba(4, 120, 87, .12), var(--shadow); }
.pcard:hover .i3d, .dcard:hover .i3d, .plban:hover .lexi { animation: wiggle .75s var(--spring); }
:root[data-theme="dark"] .pcard, :root[data-theme="dark"] .dcard { background: rgba(27, 17, 64, .86); border-color: rgba(255, 255, 255, .07); }

/* listening tasks */
.hear { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 18px; }
.hear__btn { position: relative; width: 96px; height: 96px; border: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--grad); box-shadow: inset 0 2px 2px rgba(255, 255, 255, .4), 0 7px 0 var(--edge), 0 22px 36px -16px rgba(192, 38, 211, .9); }
.hear__btn .i { width: 42px; height: 42px; stroke-width: 2.4; }
.hear__btn::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid rgba(167, 139, 250, .6); animation: hearpulse 1.8s ease-out infinite; }
.hear__btn:active { transform: translateY(4px); box-shadow: inset 0 2px 2px rgba(255, 255, 255, .4), 0 3px 0 var(--edge); }
@keyframes hearpulse { from { opacity: 1; scale: .9; } to { opacity: 0; scale: 1.35; } }

/* placement result bars */
.plbars { display: grid; gap: 10px; width: 100%; max-width: 460px; margin: 4px auto 0; }
.plbar { display: grid; grid-template-columns: 40px 1fr 44px; align-items: center; gap: 10px; font-weight: 700; }
.plbar b { font-family: var(--display); }
.plbar span { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.plbar span i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #a78bfa, #7c3aed); animation: barfill 1.2s var(--ease) .4s backwards; transform-origin: 0 50%; }
.plbar.ok span i { background: linear-gradient(90deg, #34d399, #059669); }
.plbar.now b { color: var(--accent-ink); }
.plbar em { font-style: normal; color: var(--muted); text-align: right; }

/* dialogs */
.chat { display: grid; gap: 14px; margin-top: 18px; }
.chat__intro { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--soft); font-weight: 600; color: var(--fg); }
.chat__intro .i { flex: none; margin-top: 2px; color: var(--accent-ink); }
.chat__log { display: grid; gap: 10px; }
.msg { position: relative; max-width: min(86%, 560px); padding: 10px 44px 10px 14px; border-radius: 20px; animation: msgin .45s var(--spring) backwards; }
.msg--npc { justify-self: start; border-bottom-left-radius: 6px; background: var(--card-2); border: 1px solid var(--line); }
.msg--me { justify-self: end; border-bottom-right-radius: 6px; color: #fff; background: linear-gradient(135deg, #6d28d9, #a21caf); box-shadow: 0 10px 22px -14px rgba(124, 58, 237, .9); }
.msg__who { display: block; font: 700 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.msg--me .msg__who { color: rgba(255, 255, 255, .9); }
.msg__en { font-size: 16px; font-weight: 700; }
.msg__ru { margin-top: 2px; font-size: 13.5px; color: var(--muted); }
.msg .speak { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; }
.msg--me .speak { background: rgba(255, 255, 255, .2); color: #fff; border-color: transparent; }
.msg--typing { display: flex; gap: 5px; padding: 14px 16px; }
.msg--typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); animation: typing 1s ease-in-out infinite; }
.msg--typing i:nth-child(2) { animation-delay: .15s; } .msg--typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 0%, 60%, 100% { translate: 0 0; opacity: .5; } 30% { translate: 0 -5px; opacity: 1; } }
@keyframes msgin { from { opacity: 0; translate: 0 10px; scale: .96; } }
.chat__opts { display: grid; gap: 10px; }
.chat__opts:empty { display: none; }
.chat__ask { font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.chat__opt { animation: msgin .4s var(--ease) backwards; }
.chat__opt:nth-of-type(2) { animation-delay: .06s; } .chat__opt:nth-of-type(3) { animation-delay: .12s; }
.chat__opt:disabled { opacity: .55; cursor: default; }
.coach { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; animation: msgin .4s var(--ease); }
.coach .lexi { --lx: 50px; }
.coach p { flex: 1; font-weight: 600; }
.coach--ok { background: var(--ok-soft); }
.coach--bad { background: var(--bad-soft); }
.coach--ok b { color: var(--ok); } .coach--bad b { color: var(--bad); }
.chat__end { display: grid; gap: 14px; padding-top: 6px; border-top: 1px dashed var(--line-2); }
.chat__end .say { margin: 10px 0 0; max-width: none; }

/* pronunciation */
.speak-card { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 10px; }
.speak-word { display: grid; gap: 6px; justify-items: center; padding: 26px 24px; width: 100%; max-width: 520px; border-radius: 28px; background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box; border: 3px solid transparent; box-shadow: 0 8px 0 rgba(76, 29, 149, .1), 0 30px 50px -26px rgba(124, 58, 237, .6); }
.speak-word b { font: 800 clamp(28px, 5vw, 40px)/1.1 var(--display); color: var(--fg); }
.speak-word span { font-weight: 700; color: var(--accent-ink); }
.speak-word p { color: var(--muted); }
.speak-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn.mic { min-width: 150px; }
.btn.mic.is-on { animation: micpulse 1.2s ease-in-out infinite; }
@keyframes micpulse { 50% { box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), 0 5px 0 var(--edge), 0 0 0 12px rgba(192, 38, 211, .2); } }
.speak-res { width: 100%; max-width: 560px; display: grid; gap: 12px; }
.speak-res .r-actions { justify-content: center; }
.speak-card .note { max-width: 560px; text-align: left; }
.linkbtn { border: 0; background: none; padding: 4px 8px; font-weight: 700; font-size: 13.5px; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
@media (max-width: 640px) { .nav a { font-size: 10px; padding: 6px 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
